<title>graphic-card-core/16x9@v1</title>
<!--
  ==========================================================================
  P008 ｜ 图文卡片机制详解核心（GraphicCardCore）· 组件原型 rev.1（已冻结）
  依据：ANIMATION_DRAFT.md rev.3 · COMPONENT_SPLIT.md rev.7（P008 已冻结）· anti-PPT skill（motion-native 重构流程）
  版面纪律：沿用 P002 rev.4 锁定语汇 + P004 rev.3 机制卡栈（后续机制以
  同尺寸新卡覆盖、旧卡留边）+ P007 rev.1 承接（输入即「产出 · 标题候选 ×3」）。
  --------------------------------------------------------------------------
  本章要解释的关系：同一份结构化内容 → 转成信息图 / 清单图 / 对比图等
  不同发布形态。价值来自内容结构复用与视觉重组，而不是重新编造信息
  —— Draft 事实边界；不冒充平台官方模板、不虚构发布成功。
  --------------------------------------------------------------------------
  视觉隐喻：同构换装 + 压印留痕。刻意区别于 P007 的「折射发散」：
  P007 是一份内容在空间上分裂为多个候选供人选（多对象共存、空槽收尾）；
  P008 是同一份结构在时间上连续换装（单对象多状态、痕迹留存）：
    · 上一章产出条飞入舞台，凝结为「内容结构」栏（字段清单全程在场，
      是复用的来源）；
    · 空卡壳入场，第一种形态（信息图）骨架拼装，字段文字自结构栏
      写入卡槽，结构栏 → 卡片描出 1px 关系青细迹；
    · 换装 ×2：旧骨架散、新骨架聚（清单图 → 对比图），字段文字不离场、
      不重新打字，直接滑到新槽位——文字层跨形态连续即「不重新编造信息」
      的视觉证据；
    · 每种形态成形即「压印」：一枚小样自卡片压出，存入底部产出屉，
      屉注「本地产出 · 未发布」（不虚构发布成功的视觉形态）；
    · End 保留结构栏、终态卡片、三枚小样与产出标签，供 P009（素材归档）
      承接。
  --------------------------------------------------------------------------
  反 PPT 检查（anti-PPT skill §6 强制重写条件对照）：
    · 无三种形态并排等大展示——形态在同一卡片上历时切换（同对象顺序态），
      小样是次级痕迹而非并列候选，不与 P007 折射发散撞车；
    · 新对象由旧对象生成——小样自卡片压出、卡片内容自结构栏写入；
    · 文字即运动材料——字段文字滑移留位，切换时不重打；
    · 无平台 logo / 官方模板皮肤 / 发布成功标记（事实边界）；
    · 删除动画后静态截图只剩终态卡片与小样，换装过程不可读
      （通过无动画测试）；
    · 单帧一个主焦点：当前成形的卡片。
  --------------------------------------------------------------------------
  核心 Preview 数据（技术键不是最终 Slot API）:
    fields       五个结构字段 [{ key, text }, ...]（标题 / 要点×3 / 注；
                 接近真实中文长度的占位样例，正式文案须来自 Script）
    forms        三种形态名 ["信息图", "清单图", "对比图"]（骨架版式写死）
    result_tag   本章产出凝练标签（供 P009 ChapterIntro previous_context 引用）
    explain      文字解释区（左下，骨架占位，正式文案注入 #gc-explain）
  可选 Preview 数据:
    context_label  组件语境标签（默认 "机制详解 · 08"）
    input_label    输入条标签（默认 "产出 · 标题候选 ×3"，承接 P007 result_tag）
    rail_label     结构栏标题（默认 "内容结构"）
    dock_note      产出屉注记（默认 "本地产出 · 未发布"）
  --------------------------------------------------------------------------
  四状态时间表（总长 6.10s = 本原型 Preview 时长，不冻结固定前导或最终 Scene 时长）:
    Opening  0.00-1.70   卡栈 / 语境 / 解释区建立 → 标题候选产出条飞入（0.26）
                         → 凝结为内容结构栏（0.90）→ 字段清单写入（1.02 起）
                         → 空卡壳入场 + 形态签（1.42 / 1.56）
    Build    1.70-5.56   ①信息图：骨架拼装（1.70）→ 青迹描画（1.86）→
                         字段写入卡槽（1.98）→ 压印小样①（2.70）
                         ②换装清单图（3.10：骨架散聚 + 文字滑移）→ 压印②（3.94）
                         ③换装对比图（4.34）→ 压印③（5.18）→ 产出标签（5.36）
    Hero     5.56-5.84   结构栏 → 青迹 → 终态卡片 → 产出屉完整关系可读
    End      5.84-6.10   语境与解释区退位 0.35；结构栏 / 青迹 / 卡片 / 小样 /
                         产出标签保持可辨，供下一章 ChapterIntro 承接
  --------------------------------------------------------------------------
  运动约束（optical_fluidity）:
    进场 easing   cubic-bezier(0.23,1,0.32,1)  → CustomEase "hfEnter"
    画面内变化    cubic-bezier(0.77,0,0.175,1) → CustomEase "hfMove"
    单帧主强调色唯一（var(--hf-color-accent-primary)）：仅当前形态签值；本章无玻璃面。
    关系青（var(--hf-color-accent-primary)）仅结构栏 → 卡片的三条 1px 细迹 + 输入条 / 产出点。
    无渐变、无光晕、无粒子、无 3D、无虚构数据、无平台皮肤。
  --------------------------------------------------------------------------
  Seek-safe：全部状态由单条 paused GSAP timeline 驱动；无 wall clock、
  无无限循环、无随机数、无运行时网络；GSAP 使用共享本地文件。
  形态签值不做运行期文字替换（set 不可回退），三个签值预写堆叠、
  仅 opacity 交叉淡变，保证任意 seek 一致。
  reduced-motion 兜底：位移/缩放全剥离（飞入 / 换装滑移 → 原地淡入，
  擦写 → 仅 opacity，压印 → 仅 opacity）。
  ==========================================================================
-->
</head>

<template id="graphic-card-core-template">
<style>
