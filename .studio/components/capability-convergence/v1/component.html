          .to(trace.path, { strokeDashoffset: 0, opacity: 0.62, duration: 1.1, ease: "sine.inOut" }, trace.start + 0.08)
          .to(trace.head, {
            keyframes: [
              { x: trace.mid[0], y: trace.mid[1], scale: 0.96, duration: 0.46, ease: "power2.in" },
              { x: trace.center[0], y: trace.center[1], scale: 0.84, duration: 0.74, ease: "power3.out" }
            ]
          }, trace.start + 0.08)
          .to(trace.segment, { opacity: 1, scale: 1.025, duration: 0.13, repeat: 1, yoyo: true, ease: "power2.out" }, arrival - 0.08)
          .to(trace.head, { scale: 0.68, opacity: 0, duration: 0.18, ease: "power2.out" }, arrival - 0.02)
          .to(`#count-${index}`, { y: -8, opacity: 0, duration: 0.16, ease: "power2.in" }, arrival - 0.04)
          .to(`#count-${index + 1}`, { y: 0, opacity: 1, duration: 0.2, ease: "power2.out" }, arrival + 0.02);
      });

      tl.to(".ring-ghost", { opacity: 0, duration: 0.28, ease: "power2.out" }, 8.18)
        .to(".ring-complete", { opacity: 0.9, duration: 0.3, ease: "power2.out" }, 8.18)
        .to(".ring-system", { scale: 1.06, duration: 0.2, repeat: 1, yoyo: true, ease: "power2.out" }, 8.22)
        .to(".flow-path", { opacity: 0, duration: 0.32, ease: "power2.out" }, 8.32);

      traces.forEach((trace, index) => {
        tl.to(trace.head, { x: trace.orbit[0], y: trace.orbit[1], scale: 0.82, opacity: 0.42, duration: 0.62, ease: "power3.out" }, 8.46 + index * 0.07)
          .to(trace.spoke, { strokeDashoffset: 0, opacity: 0.28, duration: 0.44, ease: "sine.out" }, 8.62 + index * 0.07);
      });

      tl.from(".core-proposition", { y: 16, opacity: 0, duration: 0.42, ease: "power2.out" }, 9.28)
        .from(".core-name", { y: 24, opacity: 0, duration: 0.58, ease: "expo.out" }, 9.56)
        .from(".core-summary", { y: 18, opacity: 0, duration: 0.5, ease: "power3.out" }, 10.12)
        .from(".handoff-marker", { y: 14, opacity: 0, duration: 0.36, ease: "power2.out" }, 10.78)
        .from(".handoff-line", { scaleY: 0, duration: 0.32, ease: "expo.out" }, 10.84)
        .to(".ring-system", { scale: 1.018, duration: 0.74, ease: "sine.inOut" }, 11.08)
        .to(".ring-system", { scale: 1, duration: 0.74, ease: "sine.inOut" }, 11.82);

      const timeScale = Number(RUNTIME_VALUES.time_scale);
      if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);

      window.__timelines["capability-convergence"] = tl;
    </script>
