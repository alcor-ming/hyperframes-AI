<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>opening-weave-core/9x16@v2</title></head><body>
<template id="opening-weave-core-template">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}*{box-sizing:border-box;letter-spacing:0}#root{width:1080px;height:1920px;position:relative;padding:90px 90px 100px;color:var(--hf-color-text-primary);font-family:var(--hf-font-body);--accent:var(--hf-color-accent-primary);--surface:var(--hf-color-surface);--muted:var(--hf-color-text-secondary);--line:color-mix(in srgb,var(--hf-color-text-secondary) 30%,transparent)}header{margin-bottom:54px}header p{font-size:32px;color:var(--muted);margin:0 0 24px}h1{font-size:68px;line-height:1.3;margin:0;font-weight:700}p{line-height:1.5}.box{padding:30px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}.box strong{font-size:44px}.box p{font-size:34px;margin:12px 0 0}.box p:empty{display:none}
html[data-card-layer="stage"] *,html[data-card-layer="stage"] *::before,html[data-card-layer="stage"] *::after{-webkit-text-fill-color:transparent!important;text-shadow:none!important}
html[data-card-layer="text"] *,html[data-card-layer="text"] *::before,html[data-card-layer="text"] *::after{background:transparent!important;border-color:transparent!important;outline-color:transparent!important;box-shadow:none!important}html[data-card-layer="text"] svg{visibility:hidden!important}

.intro{font-size:40px;line-height:1.5}.weave{position:relative;height:1100px;margin-top:36px}.weave-node{position:absolute;left:140px;width:600px;height:180px;border:3px solid var(--accent);border-radius:8px;display:flex;align-items:center;gap:60px;padding:40px;background:var(--surface);z-index:2}.weave-node b{color:var(--accent);font-size:42px}.weave-node strong{font-size:62px}.n1{top:20px}.n2{top:300px}.n3{top:580px}.n4{top:860px}.spine{position:absolute;left:436px;top:20px;height:1040px;width:6px;background:var(--accent);transform-origin:top}.threads{position:absolute;inset:0}.threads i{position:absolute;left:30px;top:70px;width:820px;height:880px;border:2px solid var(--line);border-radius:45%;transform:rotate(12deg)}.threads i:nth-child(2){transform:rotate(-12deg)}.threads i:nth-child(3){transform:rotate(24deg)}.threads i:nth-child(4){transform:rotate(-24deg)}.weave-output{font-size:56px;text-align:center;color:var(--accent);margin-top:40px}</style>
<div data-hf-id="hf-2c9f" id="root" data-composition-id="opening-weave-core" data-card-layers="stage text" data-composition-variables="[{&quot;id&quot;:&quot;time_scale&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Time scale&quot;,&quot;default&quot;:1}]" data-start="0" data-width="1080" data-height="1920" data-duration="4.80">
<header data-at=".1"><p>机制开场</p><h1>十个 Skill · 一条生产线</h1></header>
<p class="intro" data-at=".3">把分散的环节，连成一条线</p><div class="weave">
    <div class="threads" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="weave-node n1" data-at=".5"><b>01</b><strong>选题</strong></div>
    <div class="weave-node n2" data-at="1"><b>02</b><strong>制作</strong></div>
    <div class="weave-node n3" data-at="1.5"><b>03</b><strong>素材</strong></div>
    <div class="weave-node n4" data-at="2"><b>04</b><strong>复盘</strong></div>
    <div class="spine" data-at="2.5"></div></div><div class="weave-output" data-at="3.2">一条生产线</div>
</div>
<script src="assets/vendor/gsap/gsap.min.js"></script>
<script>const root=document.getElementById('root');
const defaults=JSON.parse(root.dataset.compositionVariables);
const supplied=window.__hyperframes?.getVariables?.()||{};
const values=Object.fromEntries(defaults.map(item=>[item.id,Object.hasOwn(supplied,item.id)?supplied[item.id]:item.default]));
for(const el of root.querySelectorAll('[data-slot]'))if(typeof values[el.dataset.slot]==='string')el.textContent=values[el.dataset.slot];

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tl=gsap.timeline({paused:true});
for(const el of document.querySelectorAll('[data-at]'))tl.fromTo(el,{opacity:0,y:reduced?0:18},{opacity:1,y:0,duration:reduced?.15:.35,ease:'power2.out'},Number(el.dataset.at));
tl.from('.spine',{scaleY:0,duration:.65},2.5).to('.threads',{opacity:0,duration:.65},2.4);
tl.to({},{duration:.01},Number(root.dataset.duration)-.01);
const scale=Number(values.time_scale);if(Number.isFinite(scale)&&scale>0)tl.timeScale(scale);
window.__timelines={[root.dataset.compositionId]:tl};
</script>
</template></body></html>
