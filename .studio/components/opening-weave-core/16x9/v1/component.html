  粒子自远处汇聚成球面（Fibonacci 分布）→ 球体绕世界 Y 轴连续旋转，

<script>
(function () {
var DUR = 4.80;
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

/* ===== 可编辑旋钮（Preview 数据，非最终 Slot API） ===== */
var PARTICLE_COUNT = 64;                          /* 粒子总数 */
var ICON_SLOTS = ["选题", "制作", "素材", "复盘"]; /* 图标预留位 = 线节点，数量可编辑 */
var LINE_X0 = 360;
var LINE_X1 = 1560;
var LINE_Y = 480;

/* 球体参数 */
var CX = 960;
var CY = 470;
var RADIUS = 230;
var PERSP = 900;
var TILT = 0.42;               /* 绕世界 X 轴的固定倾角 */
var GOLDEN = Math.PI * (3 - Math.sqrt(5));

var NODE_N = ICON_SLOTS.length;
var field = document.getElementById("ow-field");

/* Fibonacci 球面分布（确定数，无随机） */
function spherePoint(i, n) {
  var y = 1 - (2 * (i + 0.5)) / n;
  var r = Math.sqrt(Math.max(0, 1 - y * y));
  var th = i * GOLDEN;
  return { x: r * Math.cos(th), y: y, z: r * Math.sin(th) };
}

/* 图标预留位绑定的球面顶点索引 */
function tileVertex(k, m, n) {
  return Math.floor((k + 0.5) * n / m) % n;
}

var particles = [];
var i;
for (i = 0; i < PARTICLE_COUNT; i++) {
  var p = document.createElement("div");
  p.className = "ow-particle";
  p.setAttribute("aria-hidden", "true");
  field.appendChild(p);
  particles.push({ el: p, base: spherePoint(i, PARTICLE_COUNT) });
}

var tiles = [];
for (i = 0; i < NODE_N; i++) {
  var t = document.createElement("div");
  t.className = "ow-tile";
  t.id = "ow-tile-" + i;
  t.setAttribute("data-layout-allow-overflow", "true");
  var glow = document.createElement("i");
  glow.className = "ow-tile-glow";
  glow.id = "ow-glow-" + i;
  var label = document.createElement("span");
  label.className = "ow-tile-label";
  label.id = "ow-tile-label-" + i;
  label.textContent = ICON_SLOTS[i];
  t.appendChild(glow);
  t.appendChild(label);
  field.appendChild(t);
  tiles.push({
    el: t,
    base: spherePoint(tileVertex(i, NODE_N, PARTICLE_COUNT), PARTICLE_COUNT)
  });
}

/* 横链与引出线：破折隐藏，待描画 */
var thread = document.getElementById("ow-thread");
var threadLen = thread.getTotalLength();
thread.style.strokeDasharray = String(threadLen);
thread.style.strokeDashoffset = String(threadLen);
var lead = document.getElementById("ow-lead");
var leadLen = lead.getTotalLength();
lead.style.strokeDasharray = String(leadLen);
lead.style.strokeDashoffset = String(leadLen);

/* ===== 投影：状态量全部由 GSAP tween 驱动，render 为纯函数 ===== */
var state = {
  rot: 0,        /* 世界 Y 轴旋转角 */
  gather: REDUCED ? 1 : 0,  /* 0=远处散点 1=球面 */
  morph: 0,      /* 0=球体 1=横线 */
  fade: 0,       /* 整体淡入 */
  partFade: 1,   /* 粒子在成线后退为淡纹理 */
  labelFade: 0   /* 节点短名 */
};

function lineX(k) {
  return NODE_N === 1 ? (LINE_X0 + LINE_X1) / 2
    : LINE_X0 + (LINE_X1 - LINE_X0) * k / (NODE_N - 1);
}

function project(base, radiusScale) {
  /* 绕世界 Y 轴旋转，再绕 X 轴固定倾斜 */
  var ca = Math.cos(state.rot), sa = Math.sin(state.rot);
  var x = base.x * ca + base.z * sa;
  var z1 = -base.x * sa + base.z * ca;
  var ct = Math.cos(TILT), st = Math.sin(TILT);
  var y = base.y * ct - z1 * st;
  var z = base.y * st + z1 * ct;
  var rr = RADIUS * radiusScale;
  return { x: CX + x * rr, y: CY + y * rr, z: z };
}

function render() {
  var m = state.morph;
  var g = state.gather;
  var radiusScale = 2.1 - 1.1 * g;   /* 汇聚：2.1R → 1R */
  var k;
  for (k = 0; k < particles.length; k++) {
    var pt = project(particles[k].base, radiusScale);
    /* 粒子沿全线均匀落位（数量与节点无关，形成粒子线） */
    var tx = LINE_X0 + (LINE_X1 - LINE_X0) * k / (particles.length - 1);
    var x = pt.x + (tx - pt.x) * m;
    var y = pt.y + (LINE_Y - pt.y) * m;
    var persp = PERSP / (PERSP - pt.z);
    var s = persp + (1 - persp) * m;
    var front = 0.35 + 0.65 * (pt.z / RADIUS + 1) / 2;
    var op = state.fade * state.partFade * (front + (0.9 - front) * m);
    var el = particles[k].el.style;
    el.transform = "translate3d(" + (x - 3) + "px," + (y - 3) + "px,0) scale(" + s.toFixed(3) + ")";
    el.opacity = op.toFixed(3);
  }
  for (k = 0; k < tiles.length; k++) {
    var tp = project(tiles[k].base, radiusScale);
    var txx = lineX(k);
    var x2 = tp.x + (txx - tp.x) * m;
    var y2 = tp.y + (LINE_Y - tp.y) * m;
    var ps = PERSP / (PERSP - tp.z);
    var s2 = ps + (1 - ps) * m;
    var fr = 0.45 + 0.55 * (tp.z / RADIUS + 1) / 2;
    var el2 = tiles[k].el.style;
    el2.transform = "translate3d(" + (x2 - 15) + "px," + (y2 - 15) + "px,0) scale(" + s2.toFixed(3) + ")";
    el2.opacity = (state.fade * (fr + (1 - fr) * m)).toFixed(3);
  }
}

render();

window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

/* ---------- Opening：卡栈、语境 ---------- */
tl.from("#ow-stack-back-2", R(
  { x: 18, y: -8, opacity: 0, duration: 0.28, ease: E_ENTER },
  { opacity: 0, duration: 0.22, ease: E_ENTER }), 0.10);
tl.from("#ow-stack-back-1", R(
  { x: 12, y: -5, opacity: 0, duration: 0.28, ease: E_ENTER },
  { opacity: 0, duration: 0.22, ease: E_ENTER }), 0.16);
tl.from("#ow-shell", R(
  { y: 18, opacity: 0, duration: 0.36, ease: E_ENTER },
  { opacity: 0, duration: 0.28, ease: E_ENTER }), 0.20);
tl.from("#ow-context", { opacity: 0, duration: 0.22, ease: E_ENTER }, 0.22);
tl.from("#ow-explain", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.32);

/* ---------- Build：粒子汇聚成球，绕世界 Y 轴连续旋转 ---------- */
tl.to(state, R(
  { fade: 1, duration: 0.40, ease: "power1.out", onUpdate: render },
  { fade: 1, duration: 0.30, ease: "power1.out", onUpdate: render }), 0.40);
if (!REDUCED) {
  tl.to(state, {
    gather: 1, duration: 0.70, ease: E_ENTER, onUpdate: render
  }, 0.40);
  /* 连续旋转：匀速段 + 进入凝聚前的减速段（无 wall clock） */
  tl.to(state, { rot: 6.9, duration: 1.90, ease: "none", onUpdate: render }, 0.40);
  tl.to(state, { rot: 7.5, duration: 0.40, ease: "power2.out", onUpdate: render }, 2.30);
}

/* ---------- Hero：凝聚为可编辑数量的一条线 ---------- */
tl.to(state, R(
  { morph: 1, duration: 1.10, ease: E_MOVE, onUpdate: render },
  { morph: 1, duration: 0.01, ease: "none", onUpdate: render }), 2.60);
tl.to("#ow-thread", {
  strokeDashoffset: 0,
  duration: R(0.50, 0.30),
  ease: R("power1.inOut", "power1.out")
}, 3.30);
tl.to(state, {
  partFade: 0.18, duration: 0.22, ease: "power1.out", onUpdate: render
}, 3.72);
for (i = 0; i < NODE_N; i++) {
  tl.to("#ow-tile-label-" + i, {
    opacity: 1, duration: 0.22, ease: "power1.out"
  }, 3.58 + i * 0.06);
}

/* 「选题」端点亮，结果短语浮现 */
tl.to("#ow-tile-0", {
  borderColor: "var(--hf-color-accent-primary)",
  backgroundColor: "rgba(10, 132, 255, 0.25)",
  duration: 0.24,
  ease: "power1.out"
}, 3.86);
tl.fromTo("#ow-halo",
  R({ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0 }),
  R({ scale: 1, opacity: 1, duration: 0.28, ease: "back.out(1.4)" },
    { opacity: 1, duration: 0.20, ease: "power1.out" }), 3.86);
tl.fromTo("#ow-phrase",
  R({ y: 10, opacity: 0 }, { y: 0, opacity: 0 }),
  R({ y: 0, opacity: 1, duration: 0.26, ease: E_ENTER },
    { opacity: 1, duration: 0.22, ease: E_ENTER }), 3.94);

/* ---------- 激活流沿链掠过，引出线止于壳卡内侧 ---------- */
var SWEEP_START = 4.06;
var SWEEP_DUR = 0.44;
var FLASH = [4.09, 4.17, 4.28, 4.39];
tl.fromTo("#ow-dot",
  { opacity: 0 },
  { opacity: 1, duration: R(0.06, 0.16), ease: "power1.out" }, SWEEP_START);
tl.fromTo("#ow-dot",
  { x: 354 }, { x: 1814, duration: R(SWEEP_DUR, 0.01), ease: "none" }, SWEEP_START);
tl.to("#ow-dot", { opacity: 0, duration: 0.10, ease: "power1.in" }, 4.42);

for (i = 0; i < NODE_N; i++) {
  tl.to("#ow-glow-" + i, { opacity: 0.85, duration: 0.08, ease: "power1.out" }, FLASH[i]);
  tl.to("#ow-glow-" + i, { opacity: 0, duration: 0.16, ease: "power1.in" }, FLASH[i] + 0.08);
}

tl.to("#ow-lead", {
  strokeDashoffset: 0,
  duration: R(0.14, 0.20),
  ease: R("none", "power1.out")
}, 4.39);

/* ---------- End：语境退位，画面保持 ---------- */
tl.to("#ow-context, #ow-explain", { opacity: 0.35, duration: 0.18, ease: E_MOVE }, 4.56);

const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
  ? window.__hyperframes.getVariables()
  : {};
const timeScale = Number(runtimeValues.time_scale);
if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);
window.__timelines["opening-weave-core"] = tl;

console.assert(
  document.querySelector("[data-composition-id='opening-weave-core']") &&
  window.__timelines["opening-weave-core"] === tl &&
  tl.duration() <= DUR &&
  tiles.length === NODE_N,
  "P001 HyperFrames composition contract failed"
);
})();
</script>
