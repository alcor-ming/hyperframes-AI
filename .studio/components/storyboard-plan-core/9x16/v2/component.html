<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>storyboard-plan-core/9x16@v2</title></head><body>
<template id="storyboard-plan-core-template">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}*{box-sizing:border-box;letter-spacing:0}#root{width:1080px;height:1920px;position:relative;padding:90px 90px 100px;color:var(--hf-color-text-primary);font-family:var(--hf-font-body);--accent:var(--hf-color-accent-primary);--surface:var(--hf-color-surface);--muted:var(--hf-color-text-secondary);--line:color-mix(in srgb,var(--hf-color-text-secondary) 30%,transparent)}header{margin-bottom:54px}header p{font-size:32px;color:var(--muted);margin:0 0 24px}h1{font-size:68px;line-height:1.3;margin:0;font-weight:700}p{line-height:1.5}.box{padding:30px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}.box strong{font-size:44px}.box p{font-size:34px;margin:12px 0 0}.box p:empty{display:none}
html[data-card-layer="stage"] *,html[data-card-layer="stage"] *::before,html[data-card-layer="stage"] *::after{-webkit-text-fill-color:transparent!important;text-shadow:none!important}
html[data-card-layer="text"] *,html[data-card-layer="text"] *::before,html[data-card-layer="text"] *::after{background:transparent!important;border-color:transparent!important;outline-color:transparent!important;box-shadow:none!important}html[data-card-layer="text"] svg{visibility:hidden!important}

.materials{display:flex;justify-content:space-between;font-size:36px;border-bottom:2px solid var(--line);padding-bottom:28px}.shots{display:grid;gap:34px;margin-top:44px}.shot{display:grid;grid-template-columns:310px 1fr;gap:30px;min-height:290px;border:2px solid var(--line);border-radius:8px;padding:22px}.shot-thumb{position:relative;border:2px solid var(--accent);overflow:hidden}.subject{position:absolute;width:90px;height:125px;left:90px;top:48px;border:4px solid var(--accent);border-radius:8px}.s1{width:155px;height:175px;left:58px;top:26px}.s2{width:180px;height:16px;left:48px;top:75px;border:0;background:var(--accent);box-shadow:0 40px 0 var(--line)}.horizon{position:absolute;left:0;right:0;bottom:56px;border-top:2px solid var(--line)}.shot-copy b{font-size:32px;color:var(--accent)}.shot-copy strong{display:block;font-size:46px;margin:14px 0}.shot-copy p{font-size:28px;line-height:1.5}.ruler{height:12px;border-bottom:2px solid var(--accent);background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 36px)}.progress{height:8px;background:var(--line);margin-top:44px}.progress i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:left}.count{font-size:36px}.conclusion{display:flex;justify-content:space-between;align-items:center;margin-top:44px;font-size:40px}.conclusion strong{font-size:64px;color:var(--accent)}</style>
<div data-hf-id="hf-9u8g" id="root" data-composition-id="storyboard-plan-core" data-card-layers="stage text" data-composition-variables="[{&quot;id&quot;:&quot;time_scale&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Time scale&quot;,&quot;default&quot;:1}]" data-start="0" data-duration="5" data-width="1080" data-height="1920">
<header data-at=".1"><p>分镜计划</p><h1>把脚本变成可拍的镜头</h1></header>
<div class="materials" data-at=".3"><span>画面</span><span>文字</span><span>素材</span><span>时长</span></div><div class="shots"><article class="shot" data-at="0.7"><div class="shot-thumb"><div class="subject s0"></div><div class="horizon"></div></div><div class="shot-copy"><b>01</b><strong>开场构图</strong><p>画面 · 文字 · 素材 · 时长</p><div class="ruler"></div></div></article><article class="shot" data-at="1.4"><div class="shot-thumb"><div class="subject s1"></div><div class="horizon"></div></div><div class="shot-copy"><b>02</b><strong>主体细节</strong><p>特写 · 主体 · 节奏</p><div class="ruler"></div></div></article><article class="shot" data-at="2.0999999999999996"><div class="shot-thumb"><div class="subject s2"></div><div class="horizon"></div></div><div class="shot-copy"><b>03</b><strong>文案节奏</strong><p>文案 · 层级 · 节奏</p><div class="ruler"></div></div></article></div><div class="progress" data-at="2.8"><i></i></div><p class="count" data-at="3.1">03 镜头 · 04 层素材</p><div class="conclusion" data-at="3.5"><span>拍摄前</span><strong>可执行</strong></div>
</div>
<script src="assets/vendor/gsap/gsap.min.js"></script>
<script>const root=document.getElementById('root');
const defaults=JSON.parse(root.dataset.compositionVariables);
const supplied=window.__hyperframes?.getVariables?.()||{};
const values=Object.fromEntries(defaults.map(item=>[item.id,Object.hasOwn(supplied,item.id)?supplied[item.id]:item.default]));
for(const el of root.querySelectorAll('[data-slot]'))if(typeof values[el.dataset.slot]==='string')el.textContent=values[el.dataset.slot];

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tl=gsap.timeline({paused:true});
for(const el of document.querySelectorAll('[data-at]'))tl.fromTo(el,{opacity:0,y:reduced?0:18},{opacity:1,y:0,duration:reduced?.15:.35,ease:'power2.out'},Number(el.dataset.at));
tl.from('.progress i',{scaleX:0,duration:.5},2.8);
tl.to({},{duration:.01},Number(root.dataset.duration)-.01);
const scale=Number(values.time_scale);if(Number.isFinite(scale)&&scale>0)tl.timeScale(scale);
window.__timelines={[root.dataset.compositionId]:tl};
</script>
</template></body></html>
