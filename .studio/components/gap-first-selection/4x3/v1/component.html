        label: typeof item.label === "string" ? item.label : fallback.label
      } : fallback;
    });
    const runtimeNodes = Array.isArray(RUNTIME_VALUES.workflow_nodes) && RUNTIME_VALUES.workflow_nodes.length === 4
      ? RUNTIME_VALUES.workflow_nodes
      : ["收集", "整理", "输出", "复盘"];
    const workflowNodes = runtimeNodes.map((item, index) => typeof item === "string" ? item : ["收集", "整理", "输出", "复盘"][index]);
    const selectedIndex = Math.max(1, Math.min(10, Math.trunc(Number(RUNTIME_VALUES.selected_index)) || 8));
    const selectedCandidate = candidateData[selectedIndex - 1];
    const matchColor = TONE_COLORS[selectedCandidate.tone];

    document.getElementById("gap-first-selection-root").style.setProperty("--match-color", matchColor);
    document.querySelector(".section-id").textContent = textSlot("context", "13 / 13 · 选择与收尾");
    document.querySelector(".pool-name").textContent = textSlot("pool_label", "工具候选");
    document.getElementById("pool-count").textContent = String(candidateData.length);
    document.getElementById("candidate-pool").setAttribute("aria-label", `${candidateData.length} 个候选工具`);
    document.getElementById("selection-warning").firstChild.textContent = textSlot("warning", "别一次全装");
    document.querySelector("#selection-warning small").textContent = textSlot("warning_detail", "先看你的流程卡在哪里");
    document.getElementById("workflow-owner").textContent = textSlot("workflow_label", "你的日常工作流");
    ["node-collect", "node-organize", "node-output", "node-review"].forEach((id, index) => {
      document.getElementById(id).textContent = workflowNodes[index];
    });
    document.querySelector("#bottleneck-label span").textContent = textSlot("bottleneck_kicker", "bottleneck_label");
    document.getElementById("bottleneck-label").lastChild.textContent = textSlot("bottleneck_label", "卡在反复重做");
    document.querySelector("#matched-candidate span").textContent = selectedCandidate.label;
    const trialTitle = document.getElementById("trial-title");
    const trialEmphasis = document.createElement("span");
    trialEmphasis.textContent = textSlot("trial_emphasis", "连续试用三天");
    trialTitle.replaceChildren(document.createTextNode(textSlot("trial_prefix", "只装匹配的一个，")), trialEmphasis);
    document.querySelectorAll(".usage-trace").forEach((node) => { node.textContent = textSlot("usage_label", "用过"); });
    document.querySelector(".hero-kicker").textContent = textSlot("hero_kicker", "先找缺口，再选工具");
    document.querySelector(".hero-question").textContent = textSlot("question", "你现在最头疼的是什么问题？");
    document.getElementById("primary-cta").firstChild.textContent = textSlot("primary_cta", "评论区告诉我");
    document.querySelector("#secondary-actions strong").textContent = textSlot("secondary_primary", "清单扣 1");
    document.querySelector("#secondary-actions > span:last-child").textContent = textSlot("secondary_secondary", "关注，继续拆工作流");
    document.querySelector('[data-visual-surface="selection_flow"]').setAttribute("data-surface-mode", "none");

    const poolPositions = [[2, 8], [30, 8], [58, 8], [86, 8], [114, 8], [142, 8], [170, 8], [198, 8], [226, 8], [226, 34]];
    const sourceOffsets = [[-900, 40], [-680, 210], [-440, -120], [-240, 330], [40, -270], [-760, 520], [-360, 580], [120, 430], [-70, 700], [-1060, 690]];
    const poolField = document.getElementById("pool-field");

    candidateData.forEach((item, index) => {
      const dot = document.createElement("span");
      dot.className = "candidate-dot";
      dot.id = `candidate-${index + 1}`;
      dot.dataset.anchor = item.anchor;
      dot.dataset.mode = item.mode;
      dot.style.setProperty("--candidate-color", TONE_COLORS[item.tone]);
      dot.style.left = `${poolPositions[index][0]}px`;
      dot.style.top = `${poolPositions[index][1]}px`;
      poolField.appendChild(dot);
    });

    const origin = document.createElement("span");
    origin.className = "match-origin";
    origin.id = "match-origin";
    poolField.appendChild(origin);

    if (document.querySelectorAll(".candidate-dot").length !== 10) {
      throw new Error("gap-first-selection requires exactly 10 candidates");
    }

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

    tl.fromTo("#field-grid", { opacity: 0 }, { opacity: 0.11, duration: 0.8, ease: "sine.out" }, 0.12)
      .fromTo("#field-light", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 1.2, ease: "sine.out" }, 0.18)
      .fromTo("#topline", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.52, ease: "expo.out" }, 0.20);

    document.querySelectorAll(".candidate-dot").forEach((dot, index) => {
      const isLast = index === 9;
      tl.fromTo(dot,
        { x: sourceOffsets[index][0], y: sourceOffsets[index][1], opacity: 0, scale: isLast ? 0.72 : 0.48 },
        { x: 0, y: 0, opacity: 1, scale: 1, duration: isLast ? 0.68 : 0.48, ease: isLast ? "expo.out" : (index % 2 ? "power4.out" : "power3.out") },
        isLast ? 1.34 : 0.34 + index * 0.11
      );
    });
    tl.fromTo(".pool-meta", { x: 18, opacity: 0 }, { x: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 1.88)
      .fromTo("#candidate-pool", { opacity: 0.68 }, { opacity: 1, duration: 0.28, ease: "sine.out" }, 1.92)
      .fromTo("#selection-warning", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.48, ease: "expo.out" }, 2.20)
      .fromTo("#workflow-owner", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, 2.36)
      .fromTo("#workflow-left", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.70, ease: "power2.inOut" }, 2.48)
      .fromTo("#workflow-right", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.74, ease: "sine.inOut" }, 2.66)
      .fromTo(".workflow-node", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, stagger: 0.09, ease: "power4.out" }, 2.58)
      .fromTo("#gap-slot", { scale: 0.88, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.54, ease: "power3.out" }, 3.10);

    tl.fromTo("#scan-head", { x: 0, opacity: 0 }, { x: 0, opacity: 1, duration: 0.22, ease: "power1.out" }, 4.60)
      .to("#scan-head", { x: 250, duration: 0.56, ease: "power2.inOut" }, 4.82)
      .fromTo("#halo-collect", { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 0.7, duration: 0.16, ease: "power2.out" }, 4.84)
      .to("#halo-collect", { opacity: 0, duration: 0.20, ease: "power1.in" }, 5.06)
      .to("#scan-head", { x: 500, duration: 1.01, ease: "sine.out" }, 5.39)
      .fromTo("#halo-organize", { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 0.7, duration: 0.16, ease: "power2.out" }, 5.42)
      .to("#halo-organize", { opacity: 0, duration: 0.20, ease: "power1.in" }, 5.66)
      .fromTo("#bottleneck-label", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 6.02)
      .fromTo("#match-origin", { scale: 0.84, opacity: 0 }, { scale: 1.18, opacity: 0.72, duration: 0.24, repeat: 1, yoyo: true, ease: "sine.inOut" }, 6.08)
      .to(`#candidate-${selectedIndex}`, { opacity: 0.12, duration: 0.20, ease: "power1.out" }, 6.24)
      .fromTo("#matched-candidate", { x: 0, y: 0, scale: 0.11, opacity: 0 }, { x: 0, y: 0, scale: 0.11, opacity: 1, duration: 0.20, ease: "power2.out" }, 6.24)
      .to("#scan-head", { opacity: 0, duration: 0.22, ease: "power1.out" }, 6.38)
      .to("#matched-candidate", {
        keyframes: [
          { x: -190, y: 88, scale: 0.34, duration: 0.24, ease: "power2.in" },
          { x: -492, y: 290, scale: 1, duration: 0.66, ease: "power4.out" }
        ]
      }, 6.48)
      .to("#workflow-bridge", { strokeDashoffset: 0, duration: 0.24, ease: "expo.out" }, 7.40)
      .set("#embed-pulse", { scale: 0.72, opacity: 0.92 }, 7.42)
      .to("#embed-pulse", { scale: 4.1, opacity: 0, duration: 0.54, ease: "expo.out" }, 7.42)
      .to("#gap-slot", { opacity: 0.20, duration: 0.24, ease: "power1.out" }, 7.46);

    tl.to("#workflow-system", { y: -126, scale: 0.86, duration: 0.56, ease: "power3.inOut" }, 8.20)
      .to("#selection-warning", { y: -70, opacity: 0.22, duration: 0.42, ease: "power2.inOut" }, 8.20)
      .to("#candidate-pool", { opacity: 0.22, duration: 0.42, ease: "power1.out" }, 8.20)
      .fromTo("#trial-title", { x: -22, opacity: 0 }, { x: 0, opacity: 1, duration: 0.46, ease: "expo.out" }, 8.22)
      .fromTo("#trial-rail", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.64, ease: "power3.out" }, 8.28)
      .fromTo(".day-mark", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, stagger: 0.10, ease: "power2.out" }, 8.44)
      .fromTo("#trial-progress", { scaleX: 0 }, { scaleX: 1, duration: 2.53, ease: "none" }, 8.75)
      .to("#matched-candidate", {
        keyframes: [
          { x: -260, y: 500, scale: 0.80, duration: 0.18, ease: "power2.in" },
          { x: -887, y: 532, scale: 0.80, duration: 0.32, ease: "power3.out" }
        ]
      }, 8.24)
      .to("#matched-candidate", { x: -697, duration: 0.77, ease: "none" }, 8.75)
      .fromTo("#trace-1", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out" }, 9.48)
      .to("#day-1", { backgroundColor: matchColor, duration: 0.16, ease: "power1.out" }, 9.48)
      .to("#matched-candidate", { x: -437, duration: 0.85, ease: "none" }, 9.54)
      .fromTo("#trace-2", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out" }, 10.35)
      .to("#day-2", { backgroundColor: matchColor, duration: 0.16, ease: "power1.out" }, 10.35)
      .to("#matched-candidate", { x: -177, duration: 0.87, ease: "none" }, 10.41)
      .fromTo("#trace-3", { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out" }, 11.24)
      .to("#day-3", { backgroundColor: matchColor, duration: 0.16, ease: "power1.out" }, 11.24);

    tl.to("#legacy-system", { scale: 0.20, y: -140, opacity: 0.48, duration: 0.72, ease: "power3.inOut" }, 11.60)
      .fromTo("#hero-group", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.66, ease: "expo.out" }, 11.78)
      .fromTo(".hero-kicker", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.40, ease: "power3.out" }, 11.92)
      .fromTo(".hero-question", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.56, ease: "power4.out" }, 12.02)
      .fromTo("#primary-cta", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.38, ease: "power3.out" }, 14.20)
      .fromTo("#primary-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "expo.out" }, 14.24)
      .fromTo("#secondary-actions", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, 15.00)
      .to("#hero-group", { opacity: 0.96, duration: 0.782, repeat: 1, yoyo: true, ease: "sine.inOut" }, 15.40);

    const timeScale = Number(RUNTIME_VALUES.time_scale);
    if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);

    window.__timelines["gap-first-selection"] = tl;
  </script>
  </template>
</body>
</html>
