  依据：ANIMATION_DRAFT.md rev.3、P009_HANDOFF.md、
  .hyperframes-cache/p010-data-review/ANTI_PPT_PLAN.md。

  rev.3（隐喻重设计 · 双线对照）：
  P009 归档记录落位为被检视对象 → 记录下方展开检视框 →
  同源绘出「预期 · 示意」（虚线、暗）与「实际观看 · 示意」（实线、亮）
  两条轨迹 → 游标扫过，两线分离区显影为蓝色高亮 →
  分歧点凝成问号结 → 问号沿系绳给出问题 → 问题折回结中，
  结化为珠子沿可见路径运送至下方，落点展开为「下一次实验」卡。

  隐喻：复盘 = 把预期与实际叠在同一坐标系里看差异；
  分歧不是读数，而是被显影、被摘下、被运送、被转化为下一步。

  事实边界：没有真实后台数据；两条轨迹均为明确标注的示意，
  不展示阅读量、百分比、平台归因、A/B 胜出或确定因果。

  HyperFrames：单一 paused GSAP timeline；无随机数、wall clock、
  运行时网络、无限循环或异步建表。总长 6.60s，仅为 Preview 时长。
-->

<script>
var DUR = 6.60;
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

/* 实际观看轨迹：绘制动画用 dasharray=len 描边 */
var trace = document.getElementById("dr-trace");
var traceLength = trace.getTotalLength();
trace.style.strokeDasharray = String(traceLength);
trace.style.strokeDashoffset = String(traceLength);

/* 预期轨迹：同样先描边，绘制完成后由 timeline 切换为虚线外观 */
var expected = document.getElementById("dr-expected");
var expectedLength = expected.getTotalLength();
expected.style.strokeDasharray = String(expectedLength);
expected.style.strokeDashoffset = String(expectedLength);

/* 分歧段高亮：与实际轨迹同形，用 dash 模式只显露 p 0.32–0.60 */
var HI_P1 = 0.32;
var HI_P2 = 0.60;
var hi = document.getElementById("dr-trace-hi");
hi.style.strokeDasharray =
  "0 " + (traceLength * HI_P1).toFixed(1) + " " +
  (traceLength * (HI_P2 - HI_P1)).toFixed(1) + " " +
  String(Math.ceil(traceLength));

/* 分歧显影区：按两条轨迹在 p 0.30–0.62 之间采样生成闭合区域，
   保证填充与两条曲线精确贴合 */
var gap = document.getElementById("dr-gap");
(function buildGap() {
  var n = 9;
  var d = "";
  var i;
  var pt;
  for (i = 0; i <= n; i++) {
    pt = expected.getPointAtLength(expectedLength * (0.30 + 0.32 * i / n));
    d += (i ? " L" : "M") + pt.x.toFixed(1) + " " + pt.y.toFixed(1);
  }
  for (i = n; i >= 0; i--) {
    pt = trace.getPointAtLength(traceLength * (0.30 + 0.32 * i / n));
    d += " L" + pt.x.toFixed(1) + " " + pt.y.toFixed(1);
  }
  gap.setAttribute("d", d + " Z");
})();

/* 问号结：定位在实际轨迹 p=0.60 的分歧末端 */
var DIV_P = 0.60;
var knot = document.getElementById("dr-knot");
var knotNote = document.getElementById("dr-knot-note");
var divPt = trace.getPointAtLength(traceLength * DIV_P);
knot.style.left = (40 + divPt.x) + "px";
knot.style.top = (120 + divPt.y) + "px";
knotNote.style.left = (64 + divPt.x) + "px";
knotNote.style.top = (134 + divPt.y) + "px";

/* 叠加层全局坐标：检视框 (160,300) + svg 偏移 (40,120) */
var gx = 200 + divPt.x;
var gy = 420 + divPt.y;

/* 系绳：问号结 → 问题卡顶边中点 (870,706) */
var tether = document.getElementById("dr-tether");
tether.setAttribute("d",
  "M" + gx.toFixed(1) + " " + gy.toFixed(1) +
  " C" + (gx - 50).toFixed(1) + " " + (gy + 70).toFixed(1) +
  " 930 676 870 706");
var tetherLength = tether.getTotalLength();
tether.style.strokeDasharray = String(tetherLength);
tether.style.strokeDashoffset = String(tetherLength);

/* 运送路径：问号结 → 实验卡顶边中点 (1240,706) */
var beadPath = document.getElementById("dr-bead-path");
beadPath.setAttribute("d",
