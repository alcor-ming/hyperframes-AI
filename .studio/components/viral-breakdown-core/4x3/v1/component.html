<!-- ==================== 原型检查工具 ==================== -->

<script>
/* ===== 默认 Preview 数据（占位骨架，无真实爆款内容/文案；技术键不是最终 Slot API） =====
   节奏刻度为确定性模式（x 相对标尺左缘 24px，h 为刻度高度），
   全部写死在数据里：无随机数，seek 任意时刻状态确定。 */
var SLOT_DATA = {
  context_label: "机制详解 · 03",
  container_title: "拆解结构",
  result_tag: "产出 · 拆解结构",
  layer_labels: { hook: "Hook 层", points: "卖点顺序", rhythm: "节奏标记" },
  points_count: 3,
  points_order: [2, 3, 1],
  rhythm_ticks: [
    { x: 16,  h: 14 }, { x: 61,  h: 22 }, { x: 108, h: 10 },
    { x: 156, h: 26 }, { x: 204, h: 16 }, { x: 258, h: 20 },
    { x: 308, h: 12 }
  ]
};

/* ==================== 几何常量（1440×1080 画布，与 CSS 布局一致） ==================== */
var GEO = {
  /* 三个结构层的起飞点：覆盖各自源区域中心（层尺寸 332×140） */
  LAYER_FROM: {
    hook:   { x: 144, y: 317 },  /* Hook 区中心 (310, 387) */
    points: { x: 144, y: 554 },  /* 卖点区中心 (310, 624) */
    rhythm: { x: 144, y: 708 }   /* 节奏区中心 (310, 778) */
  },
  /* 容器内槽位左缘与顶边（容器 940,250，padding 28/24，标题+封合约 70） */
  SLOT_X: 964,
  SLOT_Y: function (k) { return 344 + k * 166; }
};

/* ==================== Preview 数据注入（同步执行，渲染前就绪） ==================== */
(function injectSlots(d) {
  document.getElementById("vd-context").textContent = d.context_label;
  document.getElementById("vd-result-title").textContent = d.container_title;
  document.getElementById("vd-output-t").textContent = d.result_tag;

  /* 卡内卖点序号：乱序（Slot points_order），提取层内才是归位的 1·2·3 */
  d.points_order.forEach(function (n, i) {
    document.getElementById("vd-idx-" + i).textContent = n;
  });

  /* 卡内节奏刻度（相对卡左缘：24 + x，底部对齐标尺顶 510） */
  var rhythmRegion = document.getElementById("vd-region-rhythm");
  d.rhythm_ticks.forEach(function (t) {
    var tick = document.createElement("span");
    tick.className = "vd-tick";
    tick.style.left = (24 + t.x) + "px";
    tick.style.top = (510 - t.h) + "px";
    tick.style.height = t.h + "px";
    rhythmRegion.appendChild(tick);
  });

  /* 容器槽位 + 飞行结构层 */
  var result = document.getElementById("vd-result");
  var field = document.getElementById("vd-field");
  var order = ["hook", "points", "rhythm"];

  order.forEach(function (key, k) {
    var slot = document.createElement("div");
    slot.className = "vd-slot";
    result.appendChild(slot);

    var layer = document.createElement("div");
    layer.className = "vd-layer";
    layer.id = "vd-layer-" + key;

    var tag = document.createElement("span");
    tag.className = "vd-layer-tag";
    tag.textContent = d.layer_labels[key];
    layer.appendChild(tag);

    if (key === "hook") {
      var body = document.createElement("div");
      body.className = "vd-hook-body";
      body.innerHTML = '<span class="vd-hook-thumb"></span>' +
        '<span class="vd-hook-bars"><span class="bar b1"></span><span class="bar b2"></span></span>';
      layer.appendChild(body);
    } else if (key === "points") {
      for (var i = 0; i < d.points_count; i++) {
        var row = document.createElement("div");
        row.className = "vd-pts-row";
        row.id = "vd-pts-" + (i + 1); /* 序号即归位目标：1·2·3 */
        row.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
          '<span class="bar" style="width:' + [62, 48, 56][i % 3] + '%"></span>';
        layer.appendChild(row);
      }
    } else {
      var strip = document.createElement("div");
      strip.className = "vd-rhy-strip";
      strip.innerHTML = '<span class="line"></span>';
      d.rhythm_ticks.forEach(function (t) {
        var tick = document.createElement("span");
        tick.className = "vd-rhy-tick";
        tick.style.left = (t.x * 0.82) + "px";
        tick.style.height = (t.h * 0.9) + "px";
        strip.appendChild(tick);
      });
      layer.appendChild(strip);
    }
    field.appendChild(layer);
  });
})(SLOT_DATA);

/* ==================== Easing（optical_fluidity profile，与 ChapterIntro / P002 一致） ==================== */
var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

/* ==================== 组件 Timeline（paused · seek-safe · 同时运动 ≤ 2） ==================== */
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

/* prefers-reduced-motion：剥离位移/缩放，仅保留 opacity 交叉淡变。
   仅影响本地预览；daemon 渲染环境为 no-preference，输出始终全动效。 */
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

/* ---------- Opening（0.00-0.25 建立，关系线 0.40 描画） ---------- */
tl.from("#vd-context", { opacity: 0, duration: 0.20, ease: E_ENTER }, 0.05);
tl.from("#vd-explain", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.18);
tl.from("#vd-card", R(
  { y: 24, opacity: 0, duration: 0.40, ease: E_ENTER },
  { opacity: 0, duration: 0.32, ease: E_ENTER }), 0.10);
tl.from("#vd-result", { opacity: 0, duration: 0.28, ease: E_ENTER }, 0.18);
tl.fromTo("#vd-link",
  { strokeDasharray: 1, strokeDashoffset: 1 },
  { strokeDashoffset: 0, duration: 0.30, ease: E_MOVE }, 0.40);

/* ---------- Build：逐个功能展现 ----------
   每个提取事件同一结构：提取框亮起（唯一玻璃面 + 唯一强调色）→
   结构层在源区域就位 → hfMove 离卡入槽 → 源区域降为底稿 → 框熄。
   层移动与框熄灭错开，任意时刻同时运动 ≤ 2。 */
function extract(key, glassSel, tGlass, tMove) {
  var from = GEO.LAYER_FROM[key];
  var layer = "#vd-layer-" + key;
  var slot = { x: GEO.SLOT_X, y: GEO.SLOT_Y({ hook: 0, points: 1, rhythm: 2 }[key]) };

  /* 提取框亮起 */
  tl.fromTo(glassSel,
    { opacity: 0 },
    { opacity: 1, duration: 0.25, ease: E_ENTER }, tGlass);
  /* 结构层在源区域上方显形（读作"这一层被抬出标本"） */
  tl.fromTo(layer,
    R({ x: from.x, y: from.y, opacity: 0 }, { x: slot.x, y: slot.y, opacity: 0 }),
    R({ x: from.x, y: from.y, opacity: 1, duration: 0.20, ease: E_ENTER },
      { opacity: 1, duration: 0.20, ease: E_ENTER }), tGlass + 0.10);
  /* 离卡入槽；源区域同步降为底稿 */
  tl.to(layer, R(
    { x: slot.x, y: slot.y, duration: 0.70, ease: E_MOVE },
    { opacity: 1, duration: 0.20, ease: E_MOVE }), tMove);
  tl.to("#vd-region-" + key, { opacity: 0.35, duration: 0.22, ease: E_MOVE }, tMove + 0.10);
  /* 落定回弹：入槽后一次 0.965→1 的触觉收尾（reduced-motion 剥离） */
  if (!REDUCED) {
    tl.fromTo(layer, { scale: 0.965 }, { scale: 1, duration: 0.24, ease: E_ENTER }, tMove + 0.64);
  }
  /* 框熄（层到位后） */
  tl.to(glassSel, { opacity: 0, duration: 0.22, ease: E_MOVE }, tMove + 0.68);
}

/* ② 拆出 Hook 层（1.10 起） */
extract("hook", "#vd-glass-hook", 1.10, 1.45);

/* ③ 拆出卖点顺序（2.50 起）：卡内三段乱序标序（同向 stagger 流 = 单一事件），
     顺序结构层以乱序形态离卡，飞行途中三段归位 1·2·3（本章核心动作） */
tl.to("#vd-idx-0, #vd-idx-1, #vd-idx-2",
  { opacity: 1, duration: 0.20, stagger: 0.12, ease: E_ENTER }, 2.50);
/* 层显形前，三段先置于乱序相对位移（与卡内 2·3·1 视觉序一致） */
tl.set("#vd-pts-1", { y: 60 }, 2.99);
tl.set("#vd-pts-2", { y: -30 }, 2.99);
tl.set("#vd-pts-3", { y: -30 }, 2.99);
extract("points", "#vd-glass-points", 2.90, 3.25);
/* 飞行途中归位（3.55 起，与层移动并行为第二事件；reduced 下瞬时就位） */
if (REDUCED) {
  tl.set("#vd-pts-1, #vd-pts-2, #vd-pts-3", { y: 0 }, 3.55);
} else {
  tl.to("#vd-pts-1", { y: 0, duration: 0.42, ease: E_MOVE }, 3.55);
  tl.to("#vd-pts-2", { y: 0, duration: 0.42, ease: E_MOVE }, 3.61);
  tl.to("#vd-pts-3", { y: 0, duration: 0.42, ease: E_MOVE }, 3.67);
}

/* ④ 拆出节奏标记（4.15 起）：刻度逐格亮起（同向 stagger 流 = 单一事件），
     再提取节奏层 */
tl.fromTo(".vd-tick",
  R({ scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 0 }),
  R({ scaleY: 1, opacity: 1, duration: 0.18, stagger: 0.07, ease: E_ENTER },
    { opacity: 1, duration: 0.18, stagger: 0.07, ease: E_ENTER }), 4.15);
extract("rhythm", "#vd-glass-rhythm", 4.70, 5.05);
/* 节奏层到位：5.05 + 0.70 = 5.75；框熄 5.73 + 0.22 ≈ 5.95 */

/* ---------- Build 收束（5.65-6.05）：容器封合 + 产出标签 ---------- */
tl.to("#vd-result-seal", R(
  { scaleX: 1, duration: 0.40, ease: E_MOVE },
  { opacity: 0.55, duration: 0.30, ease: E_MOVE }), 5.85);
tl.to("#vd-result-title", { color: "var(--hf-color-text-primary)", duration: 0.30, ease: E_MOVE }, 5.95);
tl.fromTo("#vd-output",
  R({ y: 14, opacity: 0 }, { opacity: 0 }),
  R({ y: 0, opacity: 1, duration: 0.30, ease: E_ENTER },
    { opacity: 1, duration: 0.24, ease: E_ENTER }),
  6.05);

/* ---------- Hero 6.05-6.25：完整关系可读，无新动效 ---------- */

/* ---------- End（6.25-6.64）：原卡与语境退位，容器与产出保持可辨 ---------- */
tl.to("#vd-card, #vd-context, #vd-explain, #vd-link", { opacity: 0.35, duration: 0.20, ease: E_MOVE }, 6.28);
tl.to("#vd-glass-hook, #vd-glass-points, #vd-glass-rhythm", { opacity: 0, duration: 0.15, ease: E_MOVE }, 6.28);

const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")

  ? window.__hyperframes.getVariables()

  : {};

const timeScale = Number(runtimeValues.time_scale);

if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);

window.__timelines["viral-breakdown-core"] = tl;
    </script>
    </template>
