          trace: ["讀寫對象", "本機 Markdown / 雙向連結 / 索引"],
          lane: `

        {

            "當後續會話遇到相似任務，系統重新取用這條記錄，讓「下次還記得」成為可見的時間結構。"
          ],
          trace: ["復用條件", "相似任務 + 已啟用記憶"],
          lane: `
            <div class="lane-kicker">時間越過會話邊界，記錄在另一側重新被使用</div>
            <div class="lane-grid persist-grid">
              <div class="memory-rail"></div>
              <div class="session-timeline">
                <div class="session-side">
                  <div class="session-label">本次會話</div>
                  <div class="session-raw">原文 ·「請整理這份會議紀錄」</div>

      function sceneMarkup(item, index) {
        const trace = `<div class="trace-line"><span class="trace-label">${item.trace[0]}</span><span class="trace-value">${item.trace[1]}</span></div>`;
        const infoCards = item.copy.map((copy, copyIndex) => `<article class="info-card"><span class="item-index">${String(copyIndex + 1).padStart(2, "0")}</span><p class="copy-block">${copy}</p></article>`).join("");
        return `<section class="scene clip" id="rse-persist-reuse-scene-${item.id}" data-mode="${item.mode}" data-start="${index * 12}" data-duration="12" data-track-index="1">
          <div class="scene-index">${item.index}</div>
          <div class="scene-content">
            <header class="identity"><div><div class="component-id" data-layout-allow-overflow>rich-skill-explanation@v2</div><h1 class="skill-name">${item.skill}</h1></div><p class="skill-gloss">${item.gloss}</p></header>
            <main class="explanation"><section class="info-list">${infoCards}</section><div class="paper-stack"><div class="paper-back paper-back-three" data-layout-ignore></div><div class="paper-back paper-back-two" data-layout-ignore></div><div class="mode-lane">${item.lane}</div><span class="crop-mark crop-tl" data-layout-ignore></span><span class="crop-mark crop-tr" data-layout-ignore></span><span class="crop-mark crop-br" data-layout-ignore></span><span class="crop-mark crop-bl" data-layout-ignore></span></div></main>
            <footer class="trace"><div class="mode-label" data-layout-allow-overflow>mode / ${item.mode}</div>${trace}</footer>
          </div>
        </section>`;
      }

      const SELECTED_MODE = "persist-reuse";
      const selected = MODES.find((item) => item.mode === SELECTED_MODE);
      document.querySelector("#rse-persist-reuse-scenes").innerHTML = sceneMarkup(selected, 0);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function animateBase(scene, start) {
        const q = (selector) => `${scene} ${selector}`;
        tl.from(q(".component-id"), { x: -36, opacity: 0, duration: 0.52, ease: "expo.out" }, start + 0.18)
          .from(q(".skill-name"), { y: 46, duration: 0.76, ease: "power4.out" }, start + 0.3)
          .from(q(".skill-gloss"), { x: 34, opacity: 0, duration: 0.58, ease: "back.out(1.15)" }, start + 0.62)
          .from(q(".identity"), { borderColor: "rgba(39,45,56,0)", duration: 0.66, ease: "sine.out" }, start + 0.44)
          .from(q(".info-card"), { x: -32, opacity: 0, duration: 0.56, stagger: 0.08, ease: "expo.out" }, start + 0.72)
          .from(q(".item-index"), { y: 10, opacity: 0, duration: 0.36, stagger: 0.08, ease: "power2.out" }, start + 0.94)
          .from(q(".paper-back-three"), { x: 54, opacity: 0, duration: 0.48, ease: "power3.out" }, start + 0.64)
          .from(q(".paper-back-two"), { x: 50, opacity: 0, duration: 0.5, ease: "power3.out" }, start + 0.72)
          .from(q(".mode-lane"), { x: 44, opacity: 0, duration: 0.62, ease: "expo.out" }, start + 0.8)
          .from(q(".crop-mark"), { opacity: 0, duration: 0.34, stagger: 0.04, ease: "sine.out" }, start + 1.02)
          .from(q(".copy-block"), { y: 28, opacity: 0, duration: 0.62, stagger: 0.18, ease: "power3.out" }, start + 1.18)
          .from(q(".lane-kicker"), { y: 18, opacity: 0, duration: 0.42, ease: "power2.out" }, start + 3.72)
          .from(q(".mode-lane"), { borderColor: "rgba(39,45,56,0)", duration: 0.7, ease: "sine.out" }, start + 3.58)
          .from(q(".mode-label"), { x: -24, opacity: 0, duration: 0.44, ease: "power3.out" }, start + 8.92)
          .from(q(".trace-line"), { y: 22, opacity: 0, duration: 0.54, stagger: 0.12, ease: "back.out(1.05)" }, start + 9.02)
          .from(q(".trace"), { borderColor: "rgba(39,45,56,0)", duration: 0.62, ease: "sine.out" }, start + 8.86);
      }

      function animateInput(start) {
        const s = "#rse-persist-reuse-scene-input";
        tl.from(`${s} .input-tag`, { x: -34, opacity: 0, duration: 0.46, stagger: 0.13, ease: "power3.out" }, start + 4.2)

          .to(`${s} .input-tag:nth-child(1) .branch-particle`, { x: 22, duration: 1.2, repeat: 4, stagger: 0.18, ease: "none" }, start + 4.9)
          .to(`${s} .input-tag:nth-child(2) .branch-particle`, { x: 22, duration: 1.2, repeat: 4, stagger: 0.18, ease: "none" }, start + 5.3)
          .to(`${s} .input-tag:nth-child(3) .branch-particle`, { x: 22, duration: 1.2, repeat: 4, stagger: 0.18, ease: "none" }, start + 5.7)

          .to(`${s} .orbit-node.read`, { color: "var(--hf-color-accent-primary)", scale: 1.14, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 7.98);
      }

      function animatePersist(start) {
        const s = "#rse-persist-reuse-scene-persist";
        tl.from(`${s} .session-side:first-child .session-label`, { x: -34, opacity: 0, duration: 0.46, ease: "expo.out" }, start + 4.02)
          .from(`${s} .session-raw`, { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, start + 4.32)

          .from(`${s} .memory-rail`, { scaleX: 0, duration: 0.72, ease: "expo.inOut" }, start + 5.62)
          .from(`${s} .memory-token`, { x: -30, opacity: 0, duration: 0.42, ease: "power3.out" }, start + 5.78)
          .to(`${s} .memory-rule`, { opacity: 0.42, duration: 0.4, ease: "sine.inOut" }, start + 6.1)
          .to(`${s} .memory-token`, { x: 475, duration: 0.78, ease: "power3.inOut" }, start + 6.06)
          .to(`${s} .boundary-chip`, { color: "var(--hf-color-canvas)", backgroundColor: "var(--hf-color-accent-secondary)", duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .to(`${s} .boundary-line`, { scaleX: 3, duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .to(`${s} .memory-token`, { scale: 1.08, duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .from(`${s} .session-side.right`, { x: 36, opacity: 0, duration: 0.54, ease: "expo.out" }, start + 7.08)
          .to(`${s} .memory-token`, { x: 760, duration: 0.76, ease: "power3.inOut" }, start + 7.1)

          .from(`${s} .reuse-stamp`, { scale: 1.15, duration: 0.3, ease: "power3.out" }, start + 8.42)
          .from(`${s} .boundary-note`, { y: 14, opacity: 0, duration: 0.42, ease: "power2.out" }, start + 8.66);
      }

      const scene = `#rse-persist-reuse-scene-${selected.id}`;
      animateBase(scene, 0);
      if (selected.mode === "input-transform") animateInput(0);
      if (selected.mode === "retrieve-distill") animateDistill(0);
      if (selected.mode === "knowledge-roundtrip") animateRoundtrip(0);
      if (selected.mode === "persist-reuse") animatePersist(0);

      const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
  ? window.__hyperframes.getVariables()
  : {};
const timeScale = Number(runtimeValues.time_scale);
if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);
window.__timelines["rse-persist-reuse"] = tl;
    </script>
