  ==========================================================================
  P006 ｜ 人话改写机制详解核心（ToneRewriteCore）· 组件原型 rev.1（2026-08-24 用户确认锁定）
  锁定说明：视觉、布局、时序与内部动效冻结；本原型语汇可供后续参考，
  但不作为未设计 Anchor 的固定模板，Preview 技术键不形成最终 Slot API。
  依据：ANIMATION_DRAFT.md rev.3 · COMPONENT_SPLIT.md rev.5 · anti-PPT skill
  版面纪律：沿用 P002 rev.4 锁定语汇 + P004 rev.3 机制卡栈（后续机制以
  同尺寸新卡覆盖、旧卡留边）+ P005 rev.2 材料纪律（无 3D、无工作台面板）。
  --------------------------------------------------------------------------
  本章要解释的关系：生硬 AI 文案 → 语气规则逐行重织 → 节奏改变后的人话稿
  （改写需要语气规则和本人终审，不是简单替换几个词 —— Draft 事实边界；
  不声称模型等同本人，也不复制他人的独特表达）
  --------------------------------------------------------------------------
  视觉隐喻：文字重织。文案本身是唯一主角，不装进对照卡片：
    · AI 初稿直接写入文档板，三处「AI 腔」短语被灰标记框出；
    · 语气规则以一把「规则梳」（梳脊 + 三齿：删套话 / 短句优先 / 第一人称）
      落入文首，逐行下扫；
    · 梳过之处：套话短语塌缩变暗，人话措辞以遮罩擦写方式在同一行位置
      生长出来，行长真实变短；每行行尾留下一枚青色梳痕（Tracer）；
    · 三行完成后段落断行重排收紧（节奏改变的证据，不只是换词），
      旧稿底稿完全离场；规则梳折起收进文首标签旁，成为痕迹；
    · 文档标签由「AI 初稿」翻转为「人话稿」，「本人终审」章落文首。
  --------------------------------------------------------------------------
  反 PPT 检查（anti-PPT skill §6 强制重写条件对照）：
    · 无 Before/After 并排——同一行位置连续变形（遮罩替换）；
    · 无规则卡片列表——规则是作用于文本的梳，其证据留在结果里
      （套话消失 / 行变短 / 第一人称出现）；
    · 无箭头映射——替换真实发生在同一文字对象上；
    · 删除动画后静态截图只剩结果，过程因果不可读（通过无动画测试）；
    · 单帧一个主焦点：当前被改写的行（唯一玻璃面 + 唯一蓝色）。
  --------------------------------------------------------------------------
  核心 Preview 数据（技术键不是最终 Slot API）:
    lines      三行改写对 [{ ai, cliche, cn }, ...]（接近真实中文长度的
               占位样例，正式文案须来自 Script；cliche 为 ai 中被标记短语）
    label_ai   文档初始标签（默认 "AI 初稿"）
    label_cn   改写完成标签（默认 "人话稿"）
    result_tag 本章产出凝练标签（供 P007 ChapterIntro previous_context 引用）
    explain    文字解释区（左下，骨架占位，正式文案注入 #tw-explain）
  可选 Preview 数据:
    context_label  组件语境标签（默认 "机制详解 · 06"）
    rules          规则梳三齿标注（默认 删套话 / 短句优先 / 第一人称）
    review_stamp   状态章文字（默认 "本人终审"）
  --------------------------------------------------------------------------
  四状态时间表（总长 5.90s = 本原型 Preview 时长，不冻结固定前导或最终 Scene 时长）:
    Opening  0.00-1.80   容器建立 → AI 初稿三行遮罩写入 → 三处 AI 腔标记描出
                         → 规则梳落入文首（1.30，落点即第一行重织位）
    Build    1.80-5.52   齿标注折叠（1.80，梳开始工作即收成工作形态）→
                         逐行重织 ×3
                         （1.86 / 2.56 / 3.52：梳行 → 行框亮 → 套话塌缩 →
                         人话擦写生长 → 行尾梳痕）→ 段落重排 + 旧稿离场
                         （4.48）→ 梳折起成痕迹（4.78）→ 标签翻转（5.06）→
                         本人终审落章（5.22）→ 产出标签（5.44）
    Hero     5.52-5.70   输入痕迹（梳痕）→ 处理证据（行变短）→ 输出（人话稿
                         + 本人终审章）完整关系首次同时可读
    End      5.70-5.90   语境与解释区退位 0.35；人话稿、梳痕、状态章与产出
                         标签保持可辨，供下一章 ChapterIntro 承接
  --------------------------------------------------------------------------
  运动约束（optical_fluidity）:
    进场 easing   cubic-bezier(0.23,1,0.32,1)  → CustomEase "hfEnter"
    画面内变化    cubic-bezier(0.77,0,0.175,1) → CustomEase "hfMove"
    单帧主强调色唯一（var(--hf-color-accent-primary)）：仅当前行玻璃框 + 「本人终审」章描边；
    玻璃面同一时刻只亮一个（行框逐行移交，间隙熄灭）。关系青（var(--hf-color-accent-primary)）
    仅梳脊 1px 细线与行尾梳痕。无 3D、无粒子、无扫描线。
  --------------------------------------------------------------------------
  Seek-safe：全部状态由单条 paused GSAP timeline 驱动；无 wall clock、
  无无限循环、无随机数、无运行时网络；GSAP 使用共享本地文件。
  reduced-motion 兜底：位移/缩放全剥离（梳移动 → tl.set 瞬时 reposition
  + opacity 脉冲，擦写 → 仅 opacity 交叉淡变，落章 → 仅 opacity）。

  ==========================================================================

  lines: [
    { ai: "在当今快节奏的社会中，时间管理尤为重要。", cliche: "在当今快节奏的社会中，", cn: "做号这一年，我最缺的就是时间。" },
    { ai: "本文将系统性地介绍三个核心方法论。", cliche: "系统性地", cn: "今天只讲三件我踩过坑的事。" },
    { ai: "综上所述，坚持执行这些策略定能成功。", cliche: "综上所述，", cn: "方法不难，难的是明天还继续做。" }
  ]
};

/* ==================== 几何常量（1920×1080 画布，与 CSS 布局一致） ==================== */
var GEO = {
  /* 行位（文档局部坐标；x 一律 56，y 依行序；文档舞台位 760,250） */
  LINE_X: 56,
  LINE_Y: [140, 240, 340],
  LINE_Y_REFLOW: [140, 228, 316],  /* 重排后断行收紧：节奏改变的证据 */
  GLASS_X: 40,
  GLASS_Y_PAD: 14,                  /* 行框 top = 行 y − 14 */
  /* 规则梳（舞台坐标）：梳脊停在当前行文本顶上方 40px */
  COMB_X: 816,
  DOC_TOP: 250,
  COMB_ABOVE: 66,                   /* 梳 y = 行舞台 y − 66（含梳齿与标注高度） */
  COMB_ENTER_FROM: -40,             /* 入场相对首行位偏移 */
  COMB_FOLD: { x: 912, y: 292, scaleX: 0.12 }, /* 折起后收进文首标签旁的痕迹位 */
  TOOTH_X: [100, 380, 660]
};

/* ==================== Preview 数据注入（同步执行，渲染前就绪） ==================== */
(function injectSlots(d) {
  document.getElementById("tw-context").textContent = d.context_label;
  document.getElementById("tw-label-ai").textContent = d.label_ai;
  document.getElementById("tw-label-cn").textContent = d.label_cn;
  document.getElementById("tw-stamp").textContent = d.review_stamp;
  document.getElementById("tw-output-t").textContent = d.result_tag;

  /* 文本行：AI 稿（含 AI 腔标记短语）与人话稿（含行尾梳痕）同行位叠放 */
  var doc = document.getElementById("tw-doc");
  d.lines.forEach(function (ln, i) {
    var ai = document.createElement("div");
    ai.className = "tw-line tw-line-ai";
    ai.id = "tw-ai-" + (i + 1);
    ai.style.top = GEO.LINE_Y[i] + "px";
    var rest_before = ln.ai.slice(0, ln.ai.indexOf(ln.cliche));
    var rest_after = ln.ai.slice(ln.ai.indexOf(ln.cliche) + ln.cliche.length);
    ai.innerHTML = rest_before + '<span class="tw-cliche">' + ln.cliche +
      '<b class="tw-mark" id="tw-mark-' + (i + 1) + '"></b></span>' + rest_after;
    doc.appendChild(ai);

    var cn = document.createElement("div");
    cn.className = "tw-line tw-line-cn";
    cn.id = "tw-cn-" + (i + 1);
    cn.style.top = GEO.LINE_Y[i] + "px";
    cn.innerHTML = ln.cn + '<i class="tw-tick" id="tw-tick-' + (i + 1) + '"></i>';
    doc.appendChild(cn);
  });

  /* 规则梳三齿与标注（梳脊已在 DOM 中） */
  var comb = document.getElementById("tw-comb");
  d.rules.forEach(function (label, i) {
    var tooth = document.createElement("div");
    tooth.className = "tw-comb-tooth";
    tooth.id = "tw-tooth-" + (i + 1);
    tooth.style.left = GEO.TOOTH_X[i] + "px";
    comb.appendChild(tooth);
    var lab = document.createElement("div");
    lab.className = "tw-comb-label";
    lab.id = "tw-comb-label-" + (i + 1);
    lab.style.left = GEO.TOOTH_X[i] + "px";
    lab.textContent = label;
    comb.appendChild(lab);
  });
})(SLOT_DATA);

/* ==================== Easing（optical_fluidity profile，与 B00 / P002–P005 一致） ==================== */
var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

/* ==================== 组件 Timeline（paused · seek-safe · 同时运动 ≤ 2） ==================== */
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

/* prefers-reduced-motion：剥离位移/缩放，仅保留 opacity 交叉淡变。
   仅影响本地预览；daemon 渲染环境为 no-preference，输出始终全动效。 */
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

/* 梳 / 行框 reposition：全动效下梳做 hfMove 位移，行框瞬时置位（它是指示器，
   不是运动主体）；reduced 下两者均瞬时置位 + 仅 opacity 变化 */
function combMoveTo(stageY, t) {
  if (REDUCED) {
    tl.set("#tw-comb", { y: stageY }, t);
  } else {
    tl.to("#tw-comb", { y: stageY, duration: 0.20, ease: E_MOVE }, t);
  }
}
function glassAtLine(i, t) {
  tl.set("#tw-glass", { top: (GEO.LINE_Y[i] - GEO.GLASS_Y_PAD) + "px" }, t);
}
function combStageY(i) {
  return GEO.DOC_TOP + GEO.LINE_Y[i] - GEO.COMB_ABOVE;
}

/* ---------- Opening（0.00-1.80 容器先建立，初稿写入，问题被标出） ----------
   卡栈 → 语境 → 文档壳 → 文档标签 → AI 初稿三行遮罩写入（左起擦写，
   不整页淡入）→ 三处 AI 腔标记依次描出 */
tl.from("#tw-stack-back-2", R(
  { x: 18, y: -8, opacity: 0, duration: 0.24, ease: E_ENTER },
  { opacity: 0, duration: 0.20, ease: E_ENTER }), 0.02);
tl.from("#tw-stack-back-1", R(
  { x: 12, y: -5, opacity: 0, duration: 0.24, ease: E_ENTER },
  { opacity: 0, duration: 0.20, ease: E_ENTER }), 0.06);
tl.from("#tw-mechanism-shell", R(
  { y: 18, opacity: 0, duration: 0.30, ease: E_ENTER },
  { opacity: 0, duration: 0.26, ease: E_ENTER }), 0.08);
tl.from("#tw-context", { opacity: 0, duration: 0.20, ease: E_ENTER }, 0.05);
tl.from("#tw-doc", R(
  { y: 24, opacity: 0, duration: 0.36, ease: E_ENTER },
  { opacity: 0, duration: 0.32, ease: E_ENTER }), 0.12);
tl.from("#tw-label-ai", { opacity: 0, duration: 0.16, ease: E_ENTER }, 0.34);
tl.from("#tw-explain", { opacity: 0, duration: 0.22, ease: E_ENTER }, 0.40);

/* AI 初稿三行：遮罩左起擦写（文字即材料，reduced 降为仅 opacity） */
for (var i = 1; i <= 3; i++) {
  tl.fromTo("#tw-ai-" + i,
    R({ clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 0 }),
    R({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: E_ENTER },
      { opacity: 1, duration: 0.24, ease: E_ENTER }),
    0.42 + (i - 1) * 0.18);
}
/* 三处 AI 腔标记依次描出（问题可见；reduced 分支 from 直接带 scaleX:1） */
for (var m = 1; m <= 3; m++) {
  tl.fromTo("#tw-mark-" + m,
    R({ scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0 }),
    R({ scaleX: 1, opacity: 1, duration: 0.18, ease: E_ENTER },
      { opacity: 1, duration: 0.16, ease: E_ENTER }),
    0.98 + (m - 1) * 0.10);
}

/* ---------- Build：逐个功能展现 ---------- */

/* ① 规则梳落入文首（1.30 起）：语气规则不是列表卡片，而是一把即将
     作用于文本的梳；落点即第一行重织位 */
tl.fromTo("#tw-comb",
  R({ y: combStageY(0) + GEO.COMB_ENTER_FROM, opacity: 0 },
    { y: combStageY(0), opacity: 0 }),
  R({ y: combStageY(0), opacity: 1, duration: 0.34, ease: E_ENTER },
    { opacity: 1, duration: 0.26, ease: E_ENTER }), 1.30);

/* ② 逐行重织 ×3：梳行（首行已在位）→ 行框亮 → 套话塌缩 →
     人话同行位擦写生长（AI 行降底稿）→ 行尾梳痕 → 框熄。
     齿标注在梳开始工作时即折叠（已完成的信息不持续堆积），
     也为梳下移腾出行间空间。任意时刻同时运动 ≤ 2。 */
tl.to(".tw-comb-label", { opacity: 0, duration: 0.20, ease: E_MOVE }, 1.80);
var PASS = [
  { t: 1.86 }, /* 行 1：梳已在位 */
  { t: 2.56 }, /* 行 2 */
  { t: 3.52 }  /* 行 3 */
];
PASS.forEach(function (p, k) {
  var n = k + 1;
  if (k > 0) combMoveTo(combStageY(k), p.t);
  glassAtLine(k, p.t + (k > 0 ? 0.22 : 0));
  tl.fromTo("#tw-glass",
    { opacity: 0 },
    { opacity: 1, duration: 0.14, ease: E_ENTER }, p.t + (k > 0 ? 0.22 : 0));
  /* 套话短语塌缩变暗（删套话的直接证据） */
  tl.to("#tw-ai-" + n + " .tw-cliche",
    { opacity: 0.3, duration: 0.16, ease: E_MOVE }, p.t + (k > 0 ? 0.36 : 0.14));
  /* 人话措辞同行位擦写生长；AI 行同步降为 0.16 底稿 */
  tl.fromTo("#tw-cn-" + n,
    R({ clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 0 }),
    R({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.38, ease: E_MOVE },
      { opacity: 1, duration: 0.26, ease: E_MOVE }),
    p.t + (k > 0 ? 0.44 : 0.22));
  tl.to("#tw-ai-" + n,
    { opacity: 0.16, duration: 0.30, ease: E_MOVE }, p.t + (k > 0 ? 0.46 : 0.24));
  /* 行尾梳痕 + 框熄 */
  tl.fromTo("#tw-tick-" + n,
    R({ scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 0 }),
    R({ scaleX: 1, opacity: 0.8, duration: 0.12, ease: E_ENTER },
      { opacity: 0.8, duration: 0.12, ease: E_ENTER }),
    p.t + (k > 0 ? 0.82 : 0.64));
  tl.to("#tw-glass", { opacity: 0, duration: 0.12, ease: E_MOVE }, p.t + (k > 0 ? 0.86 : 0.66));
});

/* ③ 段落重排 + 旧稿离场（4.48 起）：断行收紧（节奏改变，不只是换词），
     AI 底稿完全离场；梳折起收进文首标签旁，成为语气规则痕迹。
     重排只用 y 位移（不动 layout 属性）；reduced 下整段剥离 */
if (!REDUCED) {
  tl.to("#tw-cn-2", { y: GEO.LINE_Y_REFLOW[1] - GEO.LINE_Y[1], duration: 0.26, ease: E_MOVE }, 4.48);
  tl.to("#tw-cn-3", { y: GEO.LINE_Y_REFLOW[2] - GEO.LINE_Y[2], duration: 0.26, ease: E_MOVE }, 4.48);
}
tl.to(".tw-line-ai", { opacity: 0, duration: 0.20, ease: E_MOVE }, 4.48);
tl.to(".tw-comb-tooth", R(
  { scaleY: 0, opacity: 0, duration: 0.14, ease: E_MOVE },
  { opacity: 0, duration: 0.14, ease: E_MOVE }), 4.78);
tl.to(".tw-comb-label", { opacity: 0, duration: 0.14, ease: E_MOVE }, 4.78);
if (!REDUCED) {
  tl.to("#tw-comb",
    { x: GEO.COMB_FOLD.x - GEO.COMB_X, y: GEO.COMB_FOLD.y, duration: 0.22, ease: E_MOVE }, 4.88);
  tl.to("#tw-comb-spine",
    { scaleX: GEO.COMB_FOLD.scaleX, duration: 0.22, ease: E_MOVE }, 4.88);
} else {
  tl.set("#tw-comb", { x: GEO.COMB_FOLD.x - GEO.COMB_X, y: GEO.COMB_FOLD.y, opacity: 0.6 }, 4.88);
  tl.set("#tw-comb-spine", { scaleX: GEO.COMB_FOLD.scaleX, opacity: 0.35 }, 4.88);
}

/* ④ 标签翻转（5.06 起）：「AI 初稿」→「人话稿」，文档身份不可逆改变 */
tl.to("#tw-label-ai", { opacity: 0, duration: 0.12, ease: E_MOVE }, 5.06);
tl.to("#tw-label-cn", { opacity: 1, duration: 0.16, ease: E_ENTER }, 5.10);

/* ⑤ 本人终审落章（5.22 起，本章核心状态标记：改写需本人终审，不声称
     模型等同本人）：章面 -8° 为静态 CSS，入场只动 wrapper 的 y/scale/opacity */
tl.fromTo("#tw-stamp-wrap",
  R({ y: -24, scale: 1.25, opacity: 0 }, { opacity: 0 }),
  R({ y: 0, scale: 1, opacity: 1, duration: 0.28, ease: E_ENTER },
    { opacity: 1, duration: 0.24, ease: E_ENTER }), 5.22);

/* 产出标签（5.44 起） */
tl.fromTo("#tw-output",
  R({ y: 14, opacity: 0 }, { opacity: 0 }),
  R({ y: 0, opacity: 1, duration: 0.20, ease: E_ENTER },
    { opacity: 1, duration: 0.18, ease: E_ENTER }), 5.44);

/* ---------- Hero 5.52-5.70：完整关系可读，无新动效 ---------- */

/* ---------- End（5.70-5.90）：语境与解释区退位，人话稿 / 梳痕 / 章 / 产出保持可辨 ---------- */
tl.to("#tw-context, #tw-explain", { opacity: 0.35, duration: 0.18, ease: E_MOVE }, 5.70);

const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
  ? window.__hyperframes.getVariables()
  : {};
const timeScale = Number(runtimeValues.time_scale);
if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);
window.__timelines["tone-rewrite-core"] = tl;
</script>


</template>
</body>
