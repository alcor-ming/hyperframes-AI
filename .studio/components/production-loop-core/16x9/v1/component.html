  （反馈成立）→ 环线向心收拢，十结聚为「工具包」印记 →
  CTA 短语生成，画面保持。

  事实边界：不表现无人审批的自动发布；CTA 不增加口播之外的承诺；
  口播结束后画面保持（生产侧负责保持段，Preview 止于短保持）。

  HyperFrames：单一 paused GSAP timeline；无随机数、wall clock、
  运行时网络、无限循环或异步建表。总长 9.80s，仅为 Preview 时长。

  rev.2 润色：开场卡栈入场放宽并加长缓动；入口弧由淡入改为描画进入，
  收尾与环线成形重叠形成动量交接；结/珠子弹出回弹收敛；珠子
  will-change 修正为 opacity（位移走 cx/cy 属性，不经 transform）。

<script>
(function () {
var DUR = 9.80;
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

var CX = 960;
var CY = 520;
var SVGNS = "http://www.w3.org/2000/svg";

/* 入口弧：非减弱动效下先以单破折描画进入，成形后换回 4 7 虚线外观 */
var entry = document.getElementById("pl-entry");
var entryLen = entry.getTotalLength();
if (!REDUCED) {
  entry.style.strokeDasharray = String(entryLen);
  entry.style.strokeDashoffset = String(entryLen);
}

/* 环线：描边成形 */
var ring = document.getElementById("pl-ring");
var ringLen = ring.getTotalLength();
ring.style.strokeDasharray = String(ringLen);
ring.style.strokeDashoffset = String(ringLen);

/* 轨迹痕：与环同形，随珠子进度同步描出 */
var trail = document.getElementById("pl-trail");
trail.style.strokeDasharray = String(ringLen);
trail.style.strokeDashoffset = String(ringLen);

/* 十结：等弧长分布于环上，p=0 处为「选题」；
   结与短名标注的位置全部由真实轨迹几何计算 */
var nodesGroup = document.getElementById("pl-nodes");
var NODE_N = 10;
var nodeEls = [];
var actEls = [];
var i;
for (i = 0; i < NODE_N; i++) {
  var pt = ring.getPointAtLength(ringLen * i / NODE_N);

  var node = document.createElementNS(SVGNS, "circle");
  node.setAttribute("class", "pl-node");
  node.setAttribute("cx", pt.x);
  node.setAttribute("cy", pt.y);
  node.setAttribute("r", "10");
  node.setAttribute("id", "pl-node-" + i);
  nodesGroup.appendChild(node);
  nodeEls.push(node);

  var act = document.createElementNS(SVGNS, "circle");
  act.setAttribute("class", "pl-node-act");
  act.setAttribute("cx", pt.x);
  act.setAttribute("cy", pt.y);
  act.setAttribute("r", "5");
  act.setAttribute("id", "pl-act-" + i);
  nodesGroup.appendChild(act);
  actEls.push(act);

  /* 短名标注：结外侧 34px，沿环心到结的方向 */
  var dx = pt.x - CX;
  var dy = pt.y - CY;
  var dl = Math.sqrt(dx * dx + dy * dy) || 1;
  var label = document.getElementById("pl-label-" + i);
  label.style.left = (pt.x + dx / dl * 34) + "px";
  label.style.top = (pt.y + dy / dl * 34) + "px";
}

/* 起点 halo 与返回注记 */
var startPt = ring.getPointAtLength(0);
var halo = document.createElementNS(SVGNS, "circle");
halo.setAttribute("class", "pl-node-halo");
halo.setAttribute("cx", startPt.x);
halo.setAttribute("cy", startPt.y);
halo.setAttribute("r", "18");
halo.setAttribute("id", "pl-halo");
nodesGroup.appendChild(halo);

var returnNote = document.getElementById("pl-return-note");
returnNote.style.left = (startPt.x - 10) + "px";
returnNote.style.top = (startPt.y - 44) + "px";

/* 珠子环流：p 0→1 一周，轨迹痕同步描出 */
var bead = document.getElementById("pl-bead");
var beadState = { p: 0 };
function applyBead() {
  var point = ring.getPointAtLength(ringLen * beadState.p);
  bead.setAttribute("cx", point.x);
  bead.setAttribute("cy", point.y);
  trail.style.strokeDashoffset = String(ringLen * (1 - beadState.p));
}
applyBead();

/* 珠子匀速环流，结 i 的到达时刻可精确计算 */
var RUN_START = 2.20;
var RUN_DUR = 3.80;
function arriveAt(idx) { return RUN_START + RUN_DUR * idx / NODE_N; }

window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

/* ---------- Opening：卡栈、语境 ---------- */
tl.from("#pl-stack-back-2", R(
  { x: 18, y: -8, opacity: 0, duration: 0.28, ease: E_ENTER },
  { opacity: 0, duration: 0.22, ease: E_ENTER }), 0.12);
tl.from("#pl-stack-back-1", R(
  { x: 12, y: -5, opacity: 0, duration: 0.28, ease: E_ENTER },
  { opacity: 0, duration: 0.22, ease: E_ENTER }), 0.20);
tl.from("#pl-shell", R(
  { y: 18, opacity: 0, duration: 0.36, ease: E_ENTER },
  { opacity: 0, duration: 0.28, ease: E_ENTER }), 0.28);
tl.from("#pl-context", { opacity: 0, duration: 0.22, ease: E_ENTER }, 0.24);
tl.from("#pl-explain", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.38);

/* ---------- 环线成形：P011 弧线描画入画，延展闭合为环 ---------- */
tl.fromTo("#pl-entry",
  { opacity: 0 },
  { opacity: 1, duration: R(0.12, 0.18), ease: "power1.out" }, 0.30);
if (!REDUCED) {
  tl.to("#pl-entry", {
    strokeDashoffset: 0,
    duration: 0.38,
    ease: "power1.inOut"
  }, 0.32);
  /* 描画完成后换回虚线外观（seek-safe 的 set，不依赖 call） */
  tl.set("#pl-entry", { strokeDasharray: "4 7" }, 0.72);
}
tl.to("#pl-ring", {
  strokeDashoffset: 0,
  duration: R(0.90, 0.30),
  ease: R("power2.inOut", "power1.out")
}, 0.60);
tl.fromTo(".pl-node",
  R({ scale: 0.4, opacity: 0 }, { scale: 1, opacity: 0 }),
  R({ scale: 1, opacity: 1, duration: 0.26, ease: "back.out(1.3)", stagger: 0.05 },
    { opacity: 1, duration: 0.20, ease: "power1.out", stagger: 0.05 }), 1.10);

/* ---------- 珠子在「选题」结凝结，起点首次亮起 ---------- */
tl.fromTo("#pl-bead",
  R({ scale: 0.5, opacity: 0 }, { scale: 1, opacity: 0 }),
  R({ scale: 1, opacity: 1, duration: 0.26, ease: "back.out(1.4)" },
    { opacity: 1, duration: 0.20, ease: "power1.out" }), 1.95);
tl.fromTo("#pl-act-0",
  { opacity: 0 },
  { opacity: 1, duration: 0.20, ease: "power1.out" }, 2.05);
tl.fromTo("#pl-label-0",
  { opacity: 0 },
  { opacity: 1, duration: 0.18, ease: "power1.out" }, 2.10);
tl.to("#pl-label-0", { opacity: 0, duration: 0.18, ease: "power1.in" }, 2.70);

/* ---------- Build：珠子匀速环流一周，逐结触发、短名即显即隐 ---------- */
tl.to(beadState, {
  p: 1,
  duration: R(RUN_DUR, 0.01),
  ease: "none",
  onUpdate: applyBead
}, RUN_START);

for (i = 1; i < NODE_N; i++) {
  tl.fromTo("#pl-act-" + i,
    { opacity: 0 },
    { opacity: 1, duration: 0.18, ease: "power1.out" }, arriveAt(i));
  tl.fromTo("#pl-label-" + i,
    { opacity: 0 },
    { opacity: 1, duration: 0.16, ease: "power1.out" }, arriveAt(i) + 0.02);
  tl.to("#pl-label-" + i,
    { opacity: 0, duration: 0.16, ease: "power1.in" }, arriveAt(i) + 0.55);
}

/* ---------- 回到起点：二次亮起，反馈闭环成立 ---------- */
tl.fromTo("#pl-halo",
  R({ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0 }),
  R({ scale: 1, opacity: 1, duration: 0.30, ease: "back.out(1.4)" },
    { opacity: 1, duration: 0.20, ease: "power1.out" }), 6.10);
tl.fromTo("#pl-return-note",
  { opacity: 0 },
  { opacity: 1, duration: 0.20, ease: "power1.out" }, 6.16);

/* ---------- Hero：环线向心收拢，十结聚为工具包印记 ---------- */
tl.to("#pl-return-note", { opacity: 0, duration: 0.18, ease: "power1.in" }, 6.92);
tl.to("#pl-ring-svg", R(
  { scale: 0.22, opacity: 0.60, duration: 0.90, ease: E_MOVE },
  { scale: 0.22, opacity: 0.60, duration: 0.01, ease: "none" }), 6.90);

tl.fromTo("#pl-mark",
  R({ scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0 }),
  R({ scale: 1, opacity: 1, duration: 0.40, ease: "back.out(1.3)" },
    { opacity: 1, duration: 0.26, ease: "power1.out" }), 7.66);
tl.fromTo("#pl-mark-text",
  { opacity: 0 },
  { opacity: 1, duration: 0.24, ease: "power1.out" }, 7.86);

/* ---------- End：CTA 生成，语境退位，画面保持 ---------- */
tl.fromTo("#pl-cta",
  R({ y: 14, opacity: 0 }, { y: 0, opacity: 0 }),
  R({ y: 0, opacity: 1, duration: 0.34, ease: E_ENTER },
    { opacity: 1, duration: 0.26, ease: E_ENTER }), 8.20);
tl.to("#pl-context, #pl-explain", { opacity: 0.35, duration: 0.22, ease: E_MOVE }, 8.48);

const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
  ? window.__hyperframes.getVariables()
  : {};
const timeScale = Number(runtimeValues.time_scale);
if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);
window.__timelines["production-loop-core"] = tl;

console.assert(
  document.querySelector("[data-composition-id='production-loop-core']") &&
  window.__timelines["production-loop-core"] === tl &&
  tl.duration() <= DUR &&
  nodeEls.length === NODE_N,
  "P012 HyperFrames composition contract failed"
);
})();
</script>
