<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>production-loop-core/9x16@v2</title></head><body>
<template id="production-loop-core-template">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}*{box-sizing:border-box;letter-spacing:0}#root{width:1080px;height:1920px;position:relative;padding:90px 90px 100px;color:var(--hf-color-text-primary);font-family:var(--hf-font-body);--accent:var(--hf-color-accent-primary);--surface:var(--hf-color-surface);--muted:var(--hf-color-text-secondary);--line:color-mix(in srgb,var(--hf-color-text-secondary) 30%,transparent)}header{margin-bottom:54px}header p{font-size:32px;color:var(--muted);margin:0 0 24px}h1{font-size:68px;line-height:1.3;margin:0;font-weight:700}p{line-height:1.5}.box{padding:30px;border:2px solid var(--line);border-radius:8px;background:var(--surface)}.box strong{font-size:44px}.box p{font-size:34px;margin:12px 0 0}.box p:empty{display:none}
html[data-card-layer="stage"] *,html[data-card-layer="stage"] *::before,html[data-card-layer="stage"] *::after{-webkit-text-fill-color:transparent!important;text-shadow:none!important}
html[data-card-layer="text"] *,html[data-card-layer="text"] *::before,html[data-card-layer="text"] *::after{background:transparent!important;border-color:transparent!important;outline-color:transparent!important;box-shadow:none!important}html[data-card-layer="text"] svg{visibility:hidden!important}

.loop-diagram{position:relative;margin-top:30px;height:1170px}.loop-track{position:absolute;left:170px;right:170px;top:50px;bottom:50px;border:5px solid var(--accent);border-radius:100px}.loop-nodes{position:relative;display:grid;grid-template-columns:310px 310px;justify-content:space-between;grid-template-rows:repeat(5,190px);row-gap:50px;z-index:2}.loop-node{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:8px}.loop-node b{color:var(--accent);font-size:30px}.loop-node strong{font-size:52px}.toolkit{position:absolute;left:310px;right:310px;top:505px;font-size:44px;text-align:center;line-height:1.5;color:var(--accent)}.loop-return{font-size:54px;text-align:center;margin-top:60px}</style>
<div data-hf-id="hf-cbep" id="root" data-composition-id="production-loop-core" data-card-layers="stage text" data-composition-variables="[{&quot;id&quot;:&quot;time_scale&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Time scale&quot;,&quot;default&quot;:1}]" data-start="0" data-width="1080" data-height="1920" data-duration="9.80">
<header data-at=".1"><p>生产闭环</p><h1>十个 Skill · 一条生产线</h1></header>
<div class="loop-diagram"><div class="loop-track" data-at=".3"></div><div class="loop-nodes"><div class="loop-node" data-at="0.5" style="grid-column:1;grid-row:1"><b>01</b><strong>选题</strong></div><div class="loop-node" data-at="0.8" style="grid-column:1;grid-row:2"><b>02</b><strong>拆解</strong></div><div class="loop-node" data-at="1.1" style="grid-column:1;grid-row:3"><b>03</b><strong>脚本</strong></div><div class="loop-node" data-at="1.4" style="grid-column:1;grid-row:4"><b>04</b><strong>分镜</strong></div><div class="loop-node" data-at="1.7" style="grid-column:1;grid-row:5"><b>05</b><strong>人话</strong></div><div class="loop-node" data-at="2.0" style="grid-column:2;grid-row:5"><b>06</b><strong>封面</strong></div><div class="loop-node" data-at="2.3" style="grid-column:2;grid-row:4"><b>07</b><strong>卡片</strong></div><div class="loop-node" data-at="2.6" style="grid-column:2;grid-row:3"><b>08</b><strong>归档</strong></div><div class="loop-node" data-at="2.9" style="grid-column:2;grid-row:2"><b>09</b><strong>复盘</strong></div><div class="loop-node" data-at="3.1999999999999997" style="grid-column:2;grid-row:1"><b>10</b><strong>周报</strong></div></div><div class="toolkit" data-at="4.2">工具包</div></div><p class="loop-return" data-at="6">回到选题</p>
</div>
<script src="assets/vendor/gsap/gsap.min.js"></script>
<script>const root=document.getElementById('root');
const defaults=JSON.parse(root.dataset.compositionVariables);
const supplied=window.__hyperframes?.getVariables?.()||{};
const values=Object.fromEntries(defaults.map(item=>[item.id,Object.hasOwn(supplied,item.id)?supplied[item.id]:item.default]));
for(const el of root.querySelectorAll('[data-slot]'))if(typeof values[el.dataset.slot]==='string')el.textContent=values[el.dataset.slot];

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tl=gsap.timeline({paused:true});
for(const el of document.querySelectorAll('[data-at]'))tl.fromTo(el,{opacity:0,y:reduced?0:18},{opacity:1,y:0,duration:reduced?.15:.35,ease:'power2.out'},Number(el.dataset.at));
tl.from('.loop-track',{scaleY:.2,opacity:0,duration:.6},.3);document.querySelectorAll('.loop-node').forEach((el,i)=>tl.to(el,{borderColor:'var(--accent)',duration:.18},2+i*.35));
tl.to({},{duration:.01},Number(root.dataset.duration)-.01);
const scale=Number(values.time_scale);if(Number.isFinite(scale)&&scale>0)tl.timeScale(scale);
window.__timelines={[root.dataset.compositionId]:tl};
</script>
</template></body></html>
