  --------------------------------------------------------------------------

      如实书写（本人自截 / 本人自录 / 仅存档原文），不声称获得授权；
    · 素材缩为架位缩略件，溯源签随行贴入架位（元数据随行 = 可追溯）；
    · 检索证据：「检索 · 封面」签出现，命中条目的架位左缘亮起，

      （数据复盘）承接。

  --------------------------------------------------------------------------

  --------------------------------------------------------------------------

  E_MOVE = "hfMove";

window.__timelines = window.__timelines || {};

/* prefers-reduced-motion：剥离位移/缩放/倾角，仅保留 opacity 交叉淡变。
   仅影响本地预览；daemon 渲染环境为 no-preference，输出始终全动效。 */
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

/* ---------- Opening（0.00-1.86 容器建立，上一章产出凝结为本章目的地） ----------

   （产出进入项目上下文）→ 虚线架位 → 散落素材入场 */
tl.from("#ma-stack-back-2", R(
  { x: 18, y: -8, opacity: 0, duration: 0.24, ease: E_ENTER },
  { opacity: 0, duration: 0.20, ease: E_ENTER }), 0.02);
tl.from("#ma-stack-back-1", R(

tl.from("#ma-mechanism-shell", R(

/* ---------- Build：逐件归档（升焦点 → 上签 → 携签入架） ---------- */
function archive(t0, n) {
  var f = GEO.FOCUS[n - 1], di = GEO.DOCK_ITEM[n - 1], dt = GEO.DOCK_TAG[n - 1];
  /* 当前素材升焦点位（倾角归 0），未处理素材退底稿 */

    { duration: 0.01, ease: E_MOVE }), t0);
  for (var o = 1; o <= 3; o++) {
    if (o > n) {
      tl.to("#ma-item-" + o, { opacity: 0.55, duration: 0.18, ease: E_MOVE }, t0);
    }
  }
  /* 溯源签展开 + 四行字段逐行写入（权利值如实） */
  tl.fromTo("#ma-tag-" + n,
    { opacity: 0 },
    { opacity: 1, duration: 0.16, ease: E_ENTER }, t0 + 0.16);
  document.querySelectorAll("#ma-tag-" + n + " .ma-tr").forEach(function (row, r) {
    tl.fromTo(row,
      R({ clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)" }),
      R({ clipPath: "inset(0% 0% 0% 0%)", duration: 0.22, ease: E_ENTER },
        { duration: 0.01, ease: E_ENTER }),
      t0 + 0.22 + r * 0.08);

  /* 携签入架：素材缩为架位缩略件，溯源签贴入架位右侧；实框标记已归档。

  tl.to("#ma-item-" + n, R(
    { x: di.x, y: di.y, scale: di.s, rotation: 0, duration: 0.34, ease: E_MOVE },

  tl.to("#ma-tag-" + n, R(
    { x: dt.x, y: dt.y, scale: dt.s, duration: 0.34, ease: E_MOVE },
    { duration: 0.01, ease: E_MOVE }), t0 + 0.74);
  tl.fromTo("#ma-fill-" + n,
    { opacity: 0 },
    { opacity: 1, duration: 0.18, ease: E_ENTER }, t0 + 0.82);
}
archive(1.86, 1);
archive(3.08, 2);
archive(4.30, 3);
