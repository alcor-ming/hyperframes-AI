    { scale: 1.35, opacity: 0, duration: 0.42, ease: "power2.out", immediateRender: false }, time);
}

/* ---------- 工具 ---------- */
function splitChars(el, text, cls) {
  el.innerHTML = "";
  Array.from(text).forEach(function (ch) {
    var sp = document.createElement("span");
    sp.className = cls;
    sp.textContent = ch === " " ? " " : ch;
    el.appendChild(sp);
  });
}

/* ---------- 样本构建：注入 DOM + 重排 timeline（同步，渲染前就绪） ---------- */
function buildComponent() {
  var s = SLOT_DATA;
  DUR = Number.isFinite(s.duration) ? Math.max(9.6, Math.min(14.27, s.duration)) : DEFAULTS.duration_seconds;
  if (s.demo === "browser-click") DUR = Math.max(10, DUR);
  var titleChars = Array.from(s.title_en);
  OPEN_END = 1.5;
  tl.seek(0, true);
  tl.clear();
  gsap.set("#rs-title-en, #rs-gloss-zh, #rs-context, #rs-progress, #rs-browser-float", { clearProps: "all" });

  /* 面包屑 / 进度刻度（13 段，当前段呼吸） */
  document.getElementById("rs-context").textContent = s.context;
  var prog = document.getElementById("rs-progress");
  prog.innerHTML = "";
  for (var i = 1; i <= s.total; i++) {
    var tk = document.createElement("span");
    tk.className = "rs-tick" + (i < s.index ? " is-done" : i === s.index ? " is-current" : "");
    prog.appendChild(tk);
  }
  var num = document.createElement("span");
  num.className = "rs-progress-num";
  num.textContent = (s.index < 10 ? "0" : "") + s.index + " / " + s.total;
  prog.appendChild(num);

  /* 身份：标题逐字 + 释义 */
  splitChars(document.getElementById("rs-title-en"), s.title_en, "rs-ch");
  document.getElementById("rs-gloss-zh").textContent = s.gloss_zh;
  document.getElementById("rs-addr").textContent = s.addr;
  splitChars(document.getElementById("rs-result-t"), s.result_tag, "rs-rc-ch");
  document.querySelector('[data-composition-id="rich-skill-explanation"]')
    .setAttribute("data-duration", String(DUR));

  /* 生长时间线分段 */
  var box = document.getElementById("rs-segs");
  box.innerHTML = "";
  s.segments.forEach(function (seg, i) {
    var el = document.createElement("div");
    el.className = "rs-seg" + (i === s.segments.length - 1 ? " is-last" : "");
    var html = '<div class="rs-seg-line" id="rs-line-' + i + '"></div>'
             + '<span class="rs-node" id="rs-node-' + i + '"></span>'
             + '<div class="rs-seg-label" id="rs-label-' + i + '"></div>';
    if (seg.skeleton) {
      html += '<div class="rs-seg-skel" id="rs-skel-' + i + '">'
            + '<div class="bar b1"></div><div class="bar b2"></div>'
            + '<div class="note"></div></div>';
    } else {
      html += '<div class="rs-seg-text" id="rs-text-' + i + '"></div>';
    }
    el.innerHTML = html;
    el.querySelector(".rs-seg-label").textContent = seg.tag;
    var copy = el.querySelector(seg.skeleton ? ".note" : ".rs-seg-text");
    copy.textContent = seg.skeleton ? seg.note : seg.text;
    box.appendChild(el);
  });

  /* 右侧演示 DOM */
  var demo = DEMOS[s.demo];
  var demoBox = document.getElementById("rs-demo");
  demo.build(demoBox);

  /* Snapshot the same final page once; only this result element travels left. */
  var thumb = document.getElementById("rs-thumb");
  thumb.innerHTML = "";
  var capture = document.createElement("div");
  capture.className = "rs-thumb-capture";
  capture.setAttribute("aria-hidden", "true");
  capture.appendChild(document.querySelector(".rs-browser-frame").cloneNode(true));
  capture.querySelectorAll("[id]").forEach(function (el) { el.removeAttribute("id"); });
  capture.querySelectorAll(".dm-cursor, .dm-drop, .dm-loading, .dm-ripple").forEach(function (el) { el.remove(); });
  thumb.appendChild(capture);
  var frame = document.querySelector("#rs-browser .rs-browser-frame");
  var oldFlash = frame.querySelector(".rs-flash");
  if (oldFlash) oldFlash.remove();
  var flash = document.createElement("div");
  flash.className = "rs-flash";
  flash.id = "rs-flash";
  frame.appendChild(flash);
  capture.querySelectorAll(".rs-flash").forEach(function (el) { el.remove(); });

  CUES = demo.schedule(tl, DUR);
  Object.keys(CUES).forEach(function (name) { tl.addLabel(name, CUES[name]); });
  tl.addLabel("sceneEnd", DUR);

  tl.fromTo("#rs-context", { opacity: 0 }, { opacity: 1, duration: 0.20 }, 0.05);
  tl.fromTo("#rs-progress", { opacity: 0 }, { opacity: 1, duration: 0.20 }, 0.10);
  tl.fromTo("#rs-browser", { x: R(160, 0), y: 0, opacity: 0, scale: R(0.96, 1) },
    { x: 0, y: 0, opacity: 1, scale: 1, duration: 1.35, ease: "back.out(1.15)" }, 0.10);
  tl.fromTo("#rs-addr", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.45);
  tl.fromTo(".rs-ch", { y: R(18, 0), opacity: 0 },
    { y: 0, opacity: 1, duration: 0.30, stagger: Math.min(0.05, 0.85 / titleChars.length), ease: E_ENTER }, 0.15);
  tl.fromTo("#rs-gloss-zh", { y: R(12, 0), opacity: 0 },
    { y: 0, opacity: 1, duration: 0.35, ease: E_ENTER }, OPEN_END);

  /* Left copy reads the operation cues, never character-weight timing. */
  s.segments.forEach(function (seg, i) {
    var conditionAt = Number.isFinite(CUES.condition) ? CUES.condition : CUES.nextText;
    var nodeAt = i === 0 ? CUES.operation : i === 1 ? CUES.next : conditionAt;
    var textAt = i === 0 ? CUES.operationText : i === 1 ? CUES.nextText : conditionAt + 0.12;
    var textTarget = seg.skeleton ? "#rs-skel-" + i : "#rs-text-" + i;
    tl.fromTo("#rs-line-" + i, { scaleY: 0 }, { scaleY: 1,
      duration: i === 0 ? CUES.next - nodeAt : 0.4, ease: "none" }, nodeAt);
    tl.fromTo("#rs-node-" + i, { backgroundColor: "#071018", borderColor: "#768D9A" },
      { backgroundColor: "#0A84FF", borderColor: "#0A84FF", duration: 0.20 }, nodeAt);
    tl.fromTo("#rs-label-" + i, { opacity: 0, color: "#768D9A" },
      { opacity: 1, color: "#F7FBFF", duration: 0.25 }, nodeAt);
    tl.fromTo(textTarget, { y: R(14, 0), opacity: 0, color: "#F7FBFF" },
      { y: 0, opacity: 1, duration: 0.40, ease: E_ENTER }, textAt);
    if (i === 0) {
      tl.to("#rs-label-0, #rs-text-0", { color: "#A8BBC8", duration: 0.3 }, CUES.nextText);
      tl.to("#rs-node-0", { backgroundColor: "#54D7FF", duration: 0.24 }, CUES.nextText);
    }
  });

  tl.set("#rs-flash", { opacity: 0 }, 0);
  if (s.demo === "browser-click") {
    tl.to("#rs-flash", { opacity: R(0.96, 0.25), duration: 0.03 }, CUES.capture);
    tl.to("#rs-flash", { opacity: 0, duration: 0.12 }, CUES.capture + 0.03);
  }
  tl.fromTo("#rs-result-card", { x: 918, y: -190, scale: 1.08, opacity: 0 },
    { x: 918, y: -190, scale: 1, opacity: 1, duration: 0.20, ease: E_ENTER }, CUES.thumbnail);
  tl.to("#rs-result-card", { x: 0, y: 0, duration: 0.65, ease: "power3.inOut" }, CUES.thumbnail + 0.20);
  tl.fromTo(".rs-result-label", { opacity: 0 }, { opacity: 1, duration: 0.25 }, CUES.landed);
  tl.fromTo(".rs-rc-ch", { opacity: 0 },
    { opacity: 1, duration: 0.05, stagger: 0.018, ease: "none" }, CUES.landed);

  /* Landing is the handoff signal; result stays put while the machine closes. */
  tl.to("#rs-browser", { y: R(-28, 0), scale: R(0.96, 1), opacity: 0,
    duration: 0.55, ease: E_MOVE }, CUES.exit);
  tl.to(".rs-seg-line", { scaleY: 0, duration: 0.35, stagger: 0.05 }, CUES.exit);
  tl.to(".rs-node, .rs-seg-label, .rs-seg-text, .rs-seg-skel",
    { opacity: 0.4, duration: 0.30 }, CUES.exit);
  tl.to("#rs-title-en, #rs-gloss-zh", { opacity: 0.7, duration: 0.30 }, CUES.exit);
  tl.to(".rs-result-label .dot", { opacity: 0.65, duration: DUR - CUES.landed, ease: "sine.inOut" }, CUES.landed);
  tl.set("#rs-result-card", { opacity: 1 }, DUR);

  // Resolve lazy tween start values before exposing the seekable sample.
  tl.progress(1, true);
  tl.seek(0, true);
}

document.querySelector('[data-visual-surface="demo_primary"]').setAttribute("data-surface-mode", "none");
buildComponent();
if (Number.isFinite(SLOT_DATA.time_scale) && SLOT_DATA.time_scale > 0) {
  tl.timeScale(SLOT_DATA.time_scale);
}
window.__timelines["rich-skill-explanation"] = tl;

</script>
</template>
