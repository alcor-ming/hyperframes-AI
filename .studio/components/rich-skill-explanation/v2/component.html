        return value && typeof value === "object" && !Array.isArray(value) ? { ...fallback, ...value } : fallback;
      };
      const itemStack = (items, className, tagName = "span") => items.map((item) => `<${tagName} class="${className}">${esc(item)}</${tagName}>`).join("");

      function laneMarkup(mode, kicker, sourceItems, resultItems) {
        if (mode === "retrieve-distill") {
          const details = detailSlot({ ratio: "12 → 3", process: "筛选 / 去重 / 保留来源" });
          return `<div class="lane-kicker">${esc(kicker)}</div><div class="lane-grid distill-grid">
            <div class="raw-stream">${itemStack(sourceItems, "raw-row")}</div>
            <div class="ratio">${esc(details.ratio)}<small>${esc(details.process)}</small></div>
            <div class="distilled">${resultItems.map((item, index) => `<div class="distilled-item"><strong>${String(index + 1).padStart(2, "0")}</strong> ${esc(item)}</div>`).join("")}</div>
          </div>`;
        }
        if (mode === "knowledge-roundtrip") {
          const details = detailSlot({ body: "每次回写都改变下一次读取的起点。知识反复进出，但路径与对象保持可辨。", core: "本机笔记" });
          const labels = [...sourceItems, "读取", "检索", "回写"];
          return `<div class="lane-kicker">${esc(kicker)}</div><div class="lane-grid roundtrip-grid">
            <div class="roundtrip-copy">${esc(details.body)}</div><div class="orbit"><div class="orbit-ring"></div><div class="orbit-core">${esc(details.core)}</div>
            <div class="orbit-node read">${esc(labels[0])}</div><div class="orbit-node search">${esc(labels[1])}</div><div class="orbit-node write">${esc(labels[2])}</div><div class="orbit-runner"></div></div>
          </div>`;
        }
        if (mode === "persist-reuse") {
          const details = detailSlot({ boundary: "会话边界", reuse: "REUSED · NEXT SESSION", note: "适用边界 · 不代表所有项目自动共用", token: "规则 ×3" });
          const source = [...sourceItems, "本次会话", "原文 ·「请整理这份会议记录」", "规则 ×3 · 保留原文 / 分组 / 标记待办"];
          const result = [...resultItems, "相似任务 · 会议纪要整理", "已套用", "来自上次会话"];
          return `<div class="lane-kicker">${esc(kicker)}</div><div class="lane-grid persist-grid"><div class="memory-rail"></div><div class="session-timeline">
            <div class="session-side"><div class="session-label">${esc(source[0])}</div><div class="session-raw">${esc(source[1])}</div><div class="memory-rule">${esc(source[2])}</div></div>
            <div class="boundary"><span class="boundary-chip" data-layout-allow-overlap>${esc(details.boundary)}</span><div class="boundary-line"></div></div>
            <div class="session-side right"><div class="session-label">${esc(result[0])}</div><div class="applied-label">${esc(result[1])}</div><div class="memory-source">${esc(result[2])}</div>
            <div class="reuse-stamp">${esc(details.reuse)}</div><div class="boundary-note">${esc(details.note)}</div></div></div><div class="memory-token">${esc(details.token)}</div></div>`;
        }
        const details = detailSlot({ path_title: "录音 → 文字 → 后续处理", path_detail: "转录不是终点，而是下一个文字动作的起点" });
        return `<div class="lane-kicker">${esc(kicker)}</div><div class="lane-grid input-grid"><div class="input-stack">${itemStack(sourceItems, "input-tag")}</div>
          <div class="transform-path"><div class="path-track"><div class="path-rule"></div><div class="path-runner"></div></div><div class="path-sentence">${esc(details.path_title)}</div><div class="path-detail">${esc(details.path_detail)}</div></div>
          <div class="output-stack">${itemStack(resultItems, "output-item")}</div></div>`;
      }

      function sceneMarkup(item, index) {
        const trace = `<div class="trace-line"><span class="trace-label">${item.trace[0]}</span><span class="trace-value">${item.trace[1]}</span></div>`;
        return `<section class="scene clip" id="scene-${item.id}" data-mode="${item.mode}" data-start="${index * 12}" data-duration="12" data-track-index="1">
          <div class="ambient" data-layout-ignore></div><div class="grain" data-layout-ignore></div><div class="scene-index">${item.index}</div>
          <div class="scene-content">
            <header class="identity"><div><div class="component-id">rich-skill-explanation@v2</div><h1 class="skill-name">${item.skill}</h1></div><p class="skill-gloss">${item.gloss}</p></header>
            <main class="explanation"><div class="copy-stack"><p class="copy-block">${item.copy[0]}</p><p class="copy-block">${item.copy[1]}</p></div><div class="mode-lane">${item.lane}</div></main>
            <footer class="trace"><div class="mode-label">mode / ${item.mode}</div>${trace}</footer>
          </div>
        </section>`;
      }

      const SELECTED_MODE = ALLOWED_MODES.includes(RUNTIME_VALUES.mode) ? RUNTIME_VALUES.mode : "input-transform";
      const selected = MODES.find((item) => item.mode === SELECTED_MODE);
      const total = Math.max(1, Math.min(20, Math.trunc(Number(RUNTIME_VALUES.sequence_total)) || 4));
      const index = Math.max(1, Math.min(total, Math.trunc(Number(RUNTIME_VALUES.sequence_index)) || 1));
      const modeDefaults = {
        "input-transform": { source: ["录音 .m4a", "访谈 .wav", "语音备忘 .mp3"], result: ["逐字文字", "段落摘要", "可编辑内容"] },
        "retrieve-distill": { source: ["同题重复内容", "较旧资料", "官方说明", "使用者回报", "无日期摘录", "原文链接", "次级引用", "版本差异"], result: ["官方版本差异", "使用条件与限制", "原文出处与日期"] },
        "knowledge-roundtrip": { source: ["读取", "检索", "回写"], result: [] },
        "persist-reuse": { source: ["本次会话", "原文 ·「请整理这份会议记录」", "规则 ×3 · 保留原文 / 分组 / 标记待办"], result: ["相似任务 · 会议纪要整理", "已套用", "来自上次会话"] }
      }[SELECTED_MODE];
      const modeKicker = {
        "input-transform": "多种输入，沿同一路径被转换",
        "retrieve-distill": "量级真的改变，不用装饰性淡入代替压缩",
        "knowledge-roundtrip": "不是单向流水线，状态能回到起点",
        "persist-reuse": "时间越过会话边界，记录在另一侧重新被使用"
      }[SELECTED_MODE];
      const sourceItems = listSlot("source_items", modeDefaults.source, SELECTED_MODE === "retrieve-distill" ? 8 : 3);
      const resultItems = listSlot("result_items", modeDefaults.result, 3);
      selected.index = `${String(index).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
      selected.skill = esc(textSlot("title", selected.skill));
      selected.gloss = esc(textSlot("subtitle", selected.gloss));
      selected.copy = [esc(textSlot("statement_1", selected.copy[0])), esc(textSlot("statement_2", selected.copy[1]))];
      selected.trace = [esc(textSlot("trace_label", selected.trace[0])), esc(textSlot("trace_value", selected.trace[1]))];
      selected.lane = laneMarkup(SELECTED_MODE, textSlot("lane_kicker", modeKicker), sourceItems, resultItems);
      document.querySelector("#scenes").innerHTML = sceneMarkup(selected, 0);
      document.querySelector('[data-visual-surface="explanation_lane"]').setAttribute("data-surface-mode", "none");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function animateBase(scene, start) {
        const q = (selector) => `${scene} ${selector}`;
        tl.from(q(".component-id"), { x: -36, opacity: 0, duration: 0.52, ease: "expo.out" }, start + 0.18)
          .from(q(".skill-name"), { y: 46, duration: 0.76, ease: "power4.out" }, start + 0.3)
          .from(q(".skill-gloss"), { x: 34, opacity: 0, duration: 0.58, ease: "back.out(1.15)" }, start + 0.62)
          .from(q(".identity"), { borderColor: "rgba(245,241,234,0)", duration: 0.66, ease: "sine.out" }, start + 0.44)
          .from(q(".copy-block:first-child"), { y: 32, opacity: 0, duration: 0.7, ease: "power3.out" }, start + 1.18)
          .to(q(".copy-block:first-child"), { opacity: 0.42, scale: 0.94, y: -8, duration: 0.55, ease: "sine.inOut" }, start + 2.62)
          .from(q(".copy-block:last-child"), { x: -28, opacity: 0, duration: 0.64, ease: "expo.out" }, start + 2.48)
          .from(q(".lane-kicker"), { y: 18, opacity: 0, duration: 0.42, ease: "power2.out" }, start + 3.72)
          .from(q(".mode-lane"), { borderColor: "rgba(245,241,234,0)", duration: 0.7, ease: "sine.out" }, start + 3.58)
          .from(q(".mode-label"), { x: -24, opacity: 0, duration: 0.44, ease: "power3.out" }, start + 8.92)
          .from(q(".trace-line"), { y: 22, opacity: 0, duration: 0.54, stagger: 0.12, ease: "back.out(1.05)" }, start + 9.02)
          .from(q(".trace"), { borderColor: "rgba(245,241,234,0)", duration: 0.62, ease: "sine.out" }, start + 8.86)
          .to(q(".ambient"), { scale: 1.08, opacity: 0.72, duration: 1.8, repeat: 4, yoyo: true, ease: "sine.inOut" }, start + 0.2);
      }

      function animateInput(start) {
        const s = "#scene-input";
        tl.from(`${s} .input-tag`, { x: -34, opacity: 0, duration: 0.46, stagger: 0.13, ease: "power3.out" }, start + 4.2)
          .from(`${s} .path-rule`, { scaleX: 0, duration: 0.78, ease: "expo.inOut" }, start + 4.68)
          .from(`${s} .path-runner`, { scale: 0.76, opacity: 0, duration: 0.34, ease: "back.out(1.2)" }, start + 5.02)
          .from(`${s} .path-sentence`, { scale: 0.88, opacity: 0, duration: 0.6, ease: "back.out(1.2)" }, start + 5.08)
          .from(`${s} .path-detail`, { y: 18, opacity: 0, duration: 0.46, ease: "power2.out" }, start + 5.64)
          .to(`${s} .path-runner`, { x: 342, duration: 1.08, ease: "power3.inOut" }, start + 5.36)
          .to(`${s} .input-tag`, { x: 30, opacity: 0.38, duration: 0.66, stagger: 0.1, ease: "power2.inOut" }, start + 6.12)
          .to(`${s} .path-runner`, { scale: 1.25, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 6.42)
          .from(`${s} .output-item`, { x: -28, scale: 0.96, opacity: 0, duration: 0.5, stagger: 0.16, ease: "back.out(1.08)" }, start + 6.56);
      }

      function animateDistill(start) {
        const s = "#scene-distill";
        tl.from(`${s} .raw-row`, { x: -38, opacity: 0, duration: 0.34, stagger: 0.07, ease: "power3.out" }, start + 4.12)
          .to(`${s} .raw-row`, { x: 76, y: (index) => (3.5 - index) * 8, scale: 0.82, opacity: 0.4, duration: 0.82, stagger: 0.04, ease: "power3.inOut" }, start + 5.28)
          .from(`${s} .ratio`, { scale: 1.24, opacity: 0, duration: 0.54, ease: "back.out(1.25)" }, start + 5.72)
          .to(`${s} .ratio`, { scale: 1.06, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 6.28)
          .from(`${s} .distilled-item`, { x: -42, opacity: 0, duration: 0.5, stagger: 0.18, ease: "expo.out" }, start + 6.32);
      }

      function animateRoundtrip(start) {
        const s = "#scene-roundtrip";
        tl.from(`${s} .roundtrip-copy`, { x: -34, opacity: 0, duration: 0.6, ease: "power3.out" }, start + 4.1)
          .from(`${s} .orbit-ring`, { scale: 0.72, opacity: 0, duration: 0.72, ease: "expo.out" }, start + 4.34)
          .from(`${s} .orbit-core`, { scale: 0.84, opacity: 0, duration: 0.48, ease: "back.out(1.3)" }, start + 4.72)
          .from(`${s} .orbit-node`, { opacity: 0, duration: 0.38, stagger: 0.18, ease: "sine.out" }, start + 5.08)
          .from(`${s} .orbit-runner`, { opacity: 0, duration: 0.3, ease: "power2.out" }, start + 5.42)
          .to(`${s} .orbit-runner`, { rotation: 360, duration: 3.25, ease: "none" }, start + 5.58)
          .to(`${s} .orbit-node.search`, { color: "#9bd6bd", scale: 1.14, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 6.38)
          .to(`${s} .orbit-node.write`, { color: "#9bd6bd", scale: 1.14, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 7.18)
          .to(`${s} .orbit-node.read`, { color: "#9bd6bd", scale: 1.14, duration: 0.15, repeat: 1, yoyo: true, ease: "power2.out" }, start + 7.98);
      }

      function animatePersist(start) {
        const s = "#scene-persist";
        tl.from(`${s} .session-side:first-child .session-label`, { x: -34, opacity: 0, duration: 0.46, ease: "expo.out" }, start + 4.02)
          .from(`${s} .session-raw`, { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, start + 4.32)
          .from(`${s} .memory-rule`, { x: -26, opacity: 0, duration: 0.56, ease: "back.out(1.12)" }, start + 4.68)
          .from(`${s} .boundary-line`, { scaleY: 0, opacity: 0, duration: 0.66, ease: "power4.out" }, start + 5.02)
          .from(`${s} .boundary-chip`, { y: -16, opacity: 0, duration: 0.4, ease: "back.out(1.2)" }, start + 5.48)
          .from(`${s} .memory-rail`, { scaleX: 0, duration: 0.72, ease: "expo.inOut" }, start + 5.62)
          .from(`${s} .memory-token`, { x: -30, opacity: 0, duration: 0.42, ease: "power3.out" }, start + 5.78)
          .to(`${s} .memory-rule`, { opacity: 0.42, duration: 0.4, ease: "sine.inOut" }, start + 6.1)
          .to(`${s} .memory-token`, { x: 330, duration: 0.78, ease: "power3.inOut" }, start + 6.06)
          .to(`${s} .boundary-chip`, { color: "#0b0b0f", backgroundColor: "#d6a8ff", boxShadow: "0 0 30px rgba(214,168,255,0.62)", duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .to(`${s} .boundary-line`, { scaleX: 3, duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .to(`${s} .memory-token`, { scale: 1.08, duration: 0.1, repeat: 1, yoyo: true, ease: "power2.inOut" }, start + 6.88)
          .from(`${s} .session-side.right`, { x: 36, opacity: 0, duration: 0.54, ease: "expo.out" }, start + 7.08)
          .to(`${s} .memory-token`, { x: 510, duration: 0.76, ease: "power3.inOut" }, start + 7.1)
          .from(`${s} .applied-label`, { y: 16, opacity: 0, duration: 0.36, ease: "power2.out" }, start + 7.88)
          .from(`${s} .memory-source`, { y: 14, opacity: 0, duration: 0.38, ease: "sine.out" }, start + 8.12)
          .from(`${s} .reuse-stamp`, { scale: 1.15, duration: 0.3, ease: "power3.out" }, start + 8.42)
          .from(`${s} .boundary-note`, { y: 14, opacity: 0, duration: 0.42, ease: "power2.out" }, start + 8.66);
      }

      const scene = `#scene-${selected.id}`;
      animateBase(scene, 0);
      if (selected.mode === "input-transform") animateInput(0);
      if (selected.mode === "retrieve-distill") animateDistill(0);
      if (selected.mode === "knowledge-roundtrip") animateRoundtrip(0);
      if (selected.mode === "persist-reuse") animatePersist(0);

      const timeScale = Number(RUNTIME_VALUES.time_scale);
      if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);

      window.__timelines["rich-skill-explanation"] = tl;
    </script>
    </template>
  </body>
</html>
