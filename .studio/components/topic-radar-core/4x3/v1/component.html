    <div class="tr-field" id="tr-field" data-layout-ignore></div>

  </div>
</div>

<!-- ==================== 原型检查工具 ==================== -->

    <script src="assets/vendor/gsap/gsap.min.js"></script>
    <script src="assets/vendor/gsap/CustomEase.min.js"></script>
<script>
/* ===== 默认 Preview 数据（占位骨架，无真实热点/榜单/文案；技术键不是最终 Slot API） =====
   泳道 0-7 对应 y = 320 + lane*64；pass 决定过闸结果。
   全部写死在数据里：无随机数，seek 任意时刻状态确定。 */
var SLOT_DATA = {
  gate_label: "相关性",
  source_labels: { hot: "热点信号", peer: "同行内容" },
  pool_title: "选题池",
  result_tag: "产出 · 选题池",
  signals: [
    { lane: 0, pass: true,  cat: "hot"  },
    { lane: 2, pass: false, cat: "peer" },
    { lane: 5, pass: true,  cat: "hot"  },
    { lane: 1, pass: true,  cat: "peer" },
    { lane: 6, pass: false, cat: "hot"  },
    { lane: 3, pass: true,  cat: "peer" },
    { lane: 7, pass: false, cat: "hot"  },
    { lane: 4, pass: true,  cat: "peer" }
  ]
};

/* ==================== 几何常量（1440×1080 画布，与 CSS 布局一致） ==================== */
var GEO = {
  /* 信号按类别从来源卡片右缘发出：hot 卡 y 396-566，peer 卡 y 652-822 */
  SIG_Y: function (cat, idx) { return (cat === "peer" ? 676 : 420) + idx * 32; },
  SIG_START_X: 396,         /* 来源卡片右缘（88 + 300 + 8） */
  SIG_GATE_X: 566,          /* 抵达闸口前沿（闸面板左缘 620） */
  POOL_SLOT_X: 1084,        /* 池内槽位左缘 */
  POOL_SLOT_Y: function (k) { return 396 + k * 78; }, /* 池 padding 28 + 标题/封合约 68 */
  POOL_SLOTS: 5
};

/* ==================== Preview 数据注入（同步执行，渲染前就绪） ==================== */
(function injectSlots(d) {
  document.getElementById("tr-gate-label").textContent = d.gate_label;
  document.getElementById("tr-src-hot-t").textContent = d.source_labels.hot;
  document.getElementById("tr-src-peer-t").textContent = d.source_labels.peer;
  document.getElementById("tr-pool-title").textContent = d.pool_title;
  document.getElementById("tr-result-t").textContent = d.result_tag;

  var pool = document.getElementById("tr-pool");
  var passCount = d.signals.filter(function (s) { return s.pass; }).length;
  for (var k = 0; k < Math.min(passCount, GEO.POOL_SLOTS); k++) {
    var slot = document.createElement("div");
    slot.className = "tr-slot";
    var chip = document.createElement("div");
    chip.className = "tr-chip";
    chip.id = "tr-chip-" + k;
    chip.innerHTML = '<span class="dot"></span><span class="bar b1"></span><span class="bar b2"></span>';
    slot.appendChild(chip);
    pool.appendChild(slot);
  }

  var field = document.getElementById("tr-field");
  d.signals.forEach(function (s, i) {
    var el = document.createElement("div");
    el.className = "tr-sig " + (s.cat === "peer" ? "peer" : "hot");
    el.id = "tr-sig-" + i;
    el.innerHTML = '<span class="dot"></span><span class="tail"></span>';
    field.appendChild(el);
  });
})(SLOT_DATA);

/* ==================== Easing（optical_fluidity profile，与 ChapterIntro 一致） ==================== */
var E_ENTER = "expo.out";
var E_MOVE = "power3.inOut";
if (window.CustomEase) {
  gsap.registerPlugin(CustomEase);
  CustomEase.create("hfEnter", "0.23,1,0.32,1");
  CustomEase.create("hfMove", "0.77,0,0.175,1");
  E_ENTER = "hfEnter";
  E_MOVE = "hfMove";
}

/* ==================== 组件 Timeline（paused · seek-safe · 同时运动 ≤ 2） ==================== */
window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });

/* prefers-reduced-motion：剥离位移/缩放，仅保留 opacity 交叉淡变。
   仅影响本地预览；daemon 渲染环境为 no-preference，输出始终全动效。 */
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function R(full, reduced) { return REDUCED ? reduced : full; }

/* ---------- Opening（0.00-0.25）：三区建立，关系线描画 ---------- */
tl.from("#tr-context", { opacity: 0, duration: 0.20, ease: E_ENTER }, 0.05);
tl.from("#tr-explain", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.18);
tl.from("#tr-src-hot, #tr-src-peer", R(
  { x: -16, opacity: 0, duration: 0.24, stagger: 0.08, ease: E_ENTER },
  { opacity: 0, duration: 0.24, stagger: 0.08, ease: E_ENTER }), 0.08);
tl.from("#tr-card-hot, #tr-card-peer", R(
  { y: 18, opacity: 0, duration: 0.26, stagger: 0.08, ease: E_ENTER },
  { opacity: 0, duration: 0.26, stagger: 0.08, ease: E_ENTER }), 0.12);
tl.from("#tr-gate", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.12);
tl.from("#tr-pool", { opacity: 0, duration: 0.24, ease: E_ENTER }, 0.16);
tl.fromTo("#tr-link-in",
  { strokeDasharray: 1, strokeDashoffset: 1 },
  { strokeDashoffset: 0, duration: 0.30, ease: E_MOVE }, 0.10);
tl.fromTo("#tr-link-out",
  { strokeDasharray: 1, strokeDashoffset: 1 },
  { strokeDashoffset: 0, duration: 0.30, ease: E_MOVE }, 0.14);

/* ---------- Build：逐个功能展现 ----------
   每条信号：汇入（0.30 + i*0.32，0.55s）→ 过闸（+0.60）→
   通过：脉冲 + 继续前行 0.70s → 落池成卡；拦截：回退 100px 淡出。
   信号间距 0.32s，同向流视为单一事件；闸口脉冲为同时段第二事件。
   信号 y 由类别内序号决定（从对应来源卡片右缘发出）。 */
var passIdx = 0;
var catIdx = { hot: 0, peer: 0 };
SLOT_DATA.signals.forEach(function (s, i) {
  var sig = "#tr-sig-" + i;
  var yLane = GEO.SIG_Y(s.cat, catIdx[s.cat]++);
  var tEnter = 0.30 + i * 0.32;
  var tGate = tEnter + 0.60;

  /* ① 信号汇入（来源区 → 闸口） */
  tl.fromTo(sig,
    R({ x: GEO.SIG_START_X, y: yLane, opacity: 0 },
      { x: GEO.SIG_GATE_X, y: yLane, opacity: 0 }),
    R({ x: GEO.SIG_GATE_X, y: yLane, opacity: 1, duration: 0.55, ease: E_ENTER },
      { opacity: 1, duration: 0.40, ease: E_ENTER }),
    tEnter);

  if (s.pass) {
    var k = passIdx++;
    /* ②a 放行：闸口脉冲（主强调色唯一动效点） */
    tl.fromTo("#tr-pulse",
      { scale: 0.65, opacity: 0.85 },
      R({ scale: 1.4, opacity: 0, duration: 0.32, ease: E_ENTER },
        { opacity: 0, duration: 0.20, ease: E_ENTER }),
      tGate);
    /* ③a 通过者落池：先移动到槽位，再淡化为卡 */
    tl.to(sig, R(
      { x: GEO.POOL_SLOT_X + 14, y: GEO.POOL_SLOT_Y(k) + 20, duration: 0.70, ease: E_MOVE },
      { opacity: 1, duration: 0.20, ease: E_MOVE }), tGate + 0.06);
    tl.to(sig, { opacity: 0, duration: 0.18, ease: E_MOVE }, tGate + 0.66);
    tl.fromTo("#tr-chip-" + k,
      R({ opacity: 0, scaleX: 0.6 }, { opacity: 0 }),
      R({ opacity: 1, scaleX: 1, duration: 0.30, ease: E_ENTER },
        { opacity: 1, duration: 0.24, ease: E_ENTER }),
      tGate + 0.64);
  } else {
    /* ②b 拦截：退回来源方向并淡出（不进入池，不产生新焦点色） */
    tl.to(sig, R(
      { x: GEO.SIG_GATE_X - 100, opacity: 0, duration: 0.45, ease: E_MOVE },
      { opacity: 0, duration: 0.30, ease: E_MOVE }),
      tGate);
  }
});
/* 最后一条信号过闸完成：0.30 + 7*0.32 + 0.60 + 0.94 ≈ 4.08 */

/* ---------- Build 收束（4.35-5.30）：池封合 + 产出标签 ---------- */
tl.to("#tr-pool-seal", R(
  { scaleX: 1, duration: 0.40, ease: E_MOVE },
  { opacity: 0.55, duration: 0.30, ease: E_MOVE }), 4.35);
tl.to("#tr-pool-title", { color: "var(--hf-color-text-primary)", duration: 0.30, ease: E_MOVE }, 4.45);
tl.fromTo("#tr-result",
  R({ y: 14, opacity: 0 }, { opacity: 0 }),
  R({ y: 0, opacity: 1, duration: 0.30, ease: E_ENTER },
    { opacity: 1, duration: 0.24, ease: E_ENTER }),
  5.00);

/* ---------- Hero 5.30-5.50：完整关系可读，无新动效 ---------- */

/* ---------- End（5.50-5.80）：来源与闸退位，池与产出保持可辨 ---------- */
tl.to("#tr-src-hot, #tr-src-peer, #tr-card-hot, #tr-card-peer, #tr-context, #tr-explain, #tr-link-in", { opacity: 0.35, duration: 0.20, ease: E_MOVE }, 5.50);
tl.to("#tr-gate, #tr-link-out", R(
  { opacity: 0.35, scale: 0.98, duration: 0.22, ease: E_MOVE },
  { opacity: 0.35, duration: 0.22, ease: E_MOVE }), 5.56);

const runtimeValues = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")

  ? window.__hyperframes.getVariables()

  : {};

const timeScale = Number(runtimeValues.time_scale);

if (Number.isFinite(timeScale) && timeScale > 0) tl.timeScale(timeScale);

window.__timelines["topic-radar-core"] = tl;
    </script>
    </template>
  </body>
</html>
