<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Plan</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px system-ui;color:#24272b;background:#fff;letter-spacing:0;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr)}
aside{display:flex;flex-direction:column;gap:12px;padding:16px;border-right:1px solid #d9dde1;min-height:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0}label{font-weight:600}select,textarea,button{font:inherit;color:inherit;border:1px solid #aeb6bf;border-radius:4px;background:white;padding:8px}textarea{resize:none;flex:1;min-height:180px;width:100%;font:13px/1.6 ui-monospace,monospace;white-space:pre;overflow:auto}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button[type=submit]{background:#147854;color:white;border-color:#147854}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #287acc;outline-offset:2px}form{display:flex;flex:1;min-height:0;flex-direction:column;gap:10px}footer{display:flex;align-items:center;gap:12px}output{overflow-wrap:anywhere;line-height:1.4}iframe{border:0;width:100%;height:100%;min-width:0}output.error{color:#a52a35}@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:48% 52%}aside{border-right:0;border-bottom:1px solid #d9dde1;padding:10px;gap:8px}textarea{min-height:70px}}
</style>
<aside>
  <header><h1>Card Plan</h1><button id="reload" type="button" title="重新载入" aria-label="重新载入">&#8635;</button></header>
  <form id="editor">
    <label for="card">卡片</label><select id="card" aria-label="卡片"></select>
    <label for="body">Plan</label><textarea id="body" spellcheck="false" aria-label="卡片 Plan"></textarea>
    <footer><button id="save" type="submit" disabled>保存</button><output id="status" role="status" aria-live="polite"></output></footer>
  </form>
</aside>
<iframe id="studio" title="HyperFrames Studio" referrerpolicy="no-referrer"></iframe>
<script>
'use strict';
const token=location.hash.slice(1);
history.replaceState(null,'',location.pathname);
const select=document.getElementById('card'),body=document.getElementById('body'),save=document.getElementById('save'),status=document.getElementById('status'),studio=document.getElementById('studio');
let cards=[],hash='',selected='',dirty=false,busy=false;
function message(text,error=false){status.textContent=text;status.className=error?'error':'';}
function controls(value){busy=value;save.disabled=value||!selected;select.disabled=value;body.disabled=value;document.getElementById('reload').disabled=value;}
function choose(id){selected=id;select.value=id;body.value=cards.find(card=>card.id===id)?.body||'';dirty=false;controls(busy);}
function apply(data){cards=data.cards;hash=data.plan_sha256;select.replaceChildren(...cards.map(card=>{const option=document.createElement('option');option.value=card.id;option.textContent=card.id+' · '+card.source;return option;}));choose(cards.some(card=>card.id===selected)?selected:(cards[0]?.id||''));if(!studio.getAttribute('src'))studio.src=data.studio_url;}
async function request(path,data){const response=await fetch(path,{method:data?'POST':'GET',headers:{'X-Card-Token':token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result;}
async function reload(){if(dirty&&!confirm('放弃未保存的修改？'))return;controls(true);try{apply(await request('/cards'));message('');}catch(error){message(error.message,true);}finally{controls(false);}}
select.addEventListener('change',()=>{if(dirty&&!confirm('放弃未保存的修改？')){select.value=selected;return;}choose(select.value);message('');});
body.addEventListener('input',()=>{dirty=true;message('未保存');});
document.getElementById('reload').addEventListener('click',reload);
document.getElementById('editor').addEventListener('submit',async event=>{event.preventDefault();if(busy||!selected)return;controls(true);message('保存中');try{apply(await request('/save',{card:selected,body:body.value,plan_sha256:hash}));studio.src=studio.src;message('已保存');}catch(error){message(error.message,true);}finally{controls(false);}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
reload();
</script>
</html>
