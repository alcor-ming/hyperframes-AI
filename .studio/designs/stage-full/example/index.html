<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>stage-full · 可编辑示例 · 观察 → 分组 → 解释</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage-full-example"
      data-composition-id="stage-full-example"
      data-width="1920" data-height="1080" data-start="0" data-duration="16" data-fps="30">

  <!-- 第 1 层 · background：世界与氛围，不承载信息 -->
  <section class="layer layer-background" data-hf-layer="background" aria-hidden="true">
    <div class="theatre-bg"></div>
    <div class="theatre-vignette"></div>
  </section>

  <!-- 第 2 层 · stage：小型纸舞台、六个物件与托盘 -->
  <section class="layer layer-stage" data-hf-layer="stage">
    <div class="rig-mount" id="rig"></div>

    <!-- 纸艺角色：左侧讲解者、右侧学习者；group / body / head / face / arm 各自独立 DOM，便于逐段检查动作 -->
    <div class="figures" id="figures">
      <div class="figure figure-host" id="fig-host">
        <svg class="figure-svg" viewBox="0 0 260 520" width="260" height="520" aria-hidden="true" focusable="false">
          <ellipse class="fig-shadow" cx="130" cy="502" rx="88" ry="16"/>
          <g class="fig-root" data-fig-part="group">
            <g class="fig-neck" data-fig-part="neck"><rect x="116" y="164" width="28" height="42" rx="12"/></g>
            <g class="fig-arm fig-arm-far" data-fig-part="arm-far">
              <path class="fig-sleeve" d="M104 202 C 80 216 68 250 65 286"/>
              <circle class="fig-hand" cx="64" cy="296" r="15"/>
            </g>
            <g class="fig-legs" data-fig-part="legs">
              <rect class="fig-leg" x="98" y="348" width="28" height="140" rx="11"/>
              <rect class="fig-leg" x="134" y="348" width="28" height="140" rx="11"/>
              <ellipse class="fig-shoe" cx="110" cy="494" rx="30" ry="14"/>
              <ellipse class="fig-shoe" cx="150" cy="494" rx="30" ry="14"/>
            </g>
            <g class="fig-body" data-fig-part="body">
              <path class="fig-torso" d="M86 194 Q130 172 174 194 L168 356 Q130 372 92 356 Z"/>
              <rect class="fig-apron" x="112" y="216" width="36" height="122" rx="10"/>
              <rect class="fig-collar" x="114" y="184" width="32" height="18" rx="9"/>
            </g>
            <g class="fig-head" data-fig-part="head">
              <path class="fig-hair-back" d="M70 120 Q66 52 130 50 Q194 52 190 120 Q182 92 164 88 Q148 84 130 84 Q112 84 96 88 Q78 92 70 120 Z"/>
              <circle class="fig-face" cx="130" cy="126" r="58"/>
              <circle class="fig-eye" cx="110" cy="118" r="10"/>
              <circle class="fig-eye" cx="150" cy="118" r="10"/>
              <g class="fig-gaze" data-fig-part="gaze">
                <circle class="fig-pupil" cx="110" cy="119" r="4.2"/>
                <circle class="fig-pupil" cx="150" cy="119" r="4.2"/>
              </g>
              <path class="fig-mouth fig-mouth-smile" d="M114 148 Q130 160 146 148"/>
              <path class="fig-mouth fig-mouth-open" d="M118 146 Q130 168 142 146 Q130 176 118 146 Z"/>
              <path class="fig-hair-front" d="M74 106 Q84 64 130 64 Q176 64 186 106 Q160 90 130 90 Q100 90 74 106 Z"/>
            </g>
            <g class="fig-arm fig-arm-near" data-fig-part="arm-near">
              <path class="fig-sleeve" d="M156 202 C 180 216 192 250 195 286"/>
              <circle class="fig-hand" cx="196" cy="296" r="15"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="figure figure-learner" id="fig-learner">
        <svg class="figure-svg" viewBox="0 0 240 480" width="240" height="480" aria-hidden="true" focusable="false">
          <ellipse class="fig-shadow" cx="120" cy="462" rx="80" ry="15"/>
          <g class="fig-root" data-fig-part="group">
            <g class="fig-hair-bun" data-fig-part="hair"><circle cx="120" cy="42" r="24"/></g>
            <g class="fig-neck" data-fig-part="neck"><rect x="108" y="150" width="24" height="40" rx="11"/></g>
            <g class="fig-arm fig-arm-far" data-fig-part="arm-far">
              <path class="fig-sleeve" d="M158 188 C 182 202 194 236 196 268"/>
              <circle class="fig-hand" cx="197" cy="276" r="14"/>
            </g>
            <g class="fig-legs" data-fig-part="legs">
              <rect class="fig-leg" x="92" y="318" width="24" height="132" rx="10"/>
              <rect class="fig-leg" x="124" y="318" width="24" height="132" rx="10"/>
              <ellipse class="fig-shoe" cx="101" cy="456" rx="27" ry="12"/>
              <ellipse class="fig-shoe" cx="139" cy="456" rx="27" ry="12"/>
            </g>
            <g class="fig-body" data-fig-part="body">
              <path class="fig-dress" d="M80 176 Q120 156 160 176 L172 330 Q120 350 68 330 Z"/>
              <rect class="fig-collar" x="106" y="164" width="28" height="16" rx="8"/>
            </g>
            <g class="fig-head" data-fig-part="head">
              <circle class="fig-face" cx="120" cy="112" r="54"/>
              <circle class="fig-eye" cx="102" cy="105" r="9"/>
              <circle class="fig-eye" cx="138" cy="105" r="9"/>
              <g class="fig-gaze" data-fig-part="gaze">
                <circle class="fig-pupil" cx="102" cy="106" r="3.8"/>
                <circle class="fig-pupil" cx="138" cy="106" r="3.8"/>
              </g>
              <path class="fig-mouth fig-mouth-smile" d="M106 132 Q120 144 134 132"/>
              <path class="fig-mouth fig-mouth-open" d="M110 130 Q120 152 130 130 Q120 158 110 130 Z"/>
              <path class="fig-hair-front" d="M68 100 Q74 54 120 54 Q166 54 172 100 Q150 82 120 82 Q90 82 68 100 Z"/>
            </g>
            <g class="fig-arm fig-arm-near" data-fig-part="arm-near">
              <path class="fig-sleeve" d="M84 188 C 60 202 48 236 46 268"/>
              <circle class="fig-hand" cx="45" cy="276" r="14"/>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <div class="wall-card wall-card-a" id="wall-card-a" aria-hidden="true">
      <svg viewBox="0 0 260 200" width="260" height="200">
        <circle cx="96" cy="92" r="52" fill="none" stroke="var(--wall-card-ink)" stroke-width="8"/>
        <line x1="134" y1="130" x2="186" y2="180" stroke="var(--wall-card-ink)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="96" cy="92" r="20" fill="var(--wall-card-accent)"/>
        <path d="M196 34l10 22 24 4-18 17 5 24-21-12-21 12 5-24-18-17 24-4z" fill="var(--wall-card-accent)" opacity=".85"/>
      </svg>
      <span class="wall-card-cap">先看清</span>
    </div>
    <div class="wall-card wall-card-b" id="wall-card-b" aria-hidden="true">
      <svg viewBox="0 0 260 200" width="260" height="200">
        <path d="M130 30a54 54 0 0 1 30 99v20h-60v-20a54 54 0 0 1 30-99z" fill="var(--wall-card-accent)"/>
        <rect x="104" y="152" width="52" height="12" rx="6" fill="var(--wall-card-ink)"/>
        <rect x="112" y="170" width="36" height="10" rx="5" fill="var(--wall-card-ink)"/>
        <g stroke="var(--wall-card-ink)" stroke-width="8" stroke-linecap="round">
          <line x1="130" y1="8" x2="130" y2="-8"/><line x1="42" y1="60" x2="22" y2="52"/><line x1="218" y1="60" x2="238" y2="52"/>
        </g>
      </svg>
      <span class="wall-card-cap">再讲清楚</span>
    </div>

    <div class="tray tray-warm" id="tray-warm">
      <span class="tray-hue tray-hue-warm" aria-hidden="true"></span>
      <span class="tray-label">暖色 · 3</span>
    </div>
    <div class="tray tray-cool" id="tray-cool">
      <span class="tray-hue tray-hue-cool" aria-hidden="true"></span>
      <span class="tray-label">冷色 · 3</span>
    </div>

    <div class="objects" id="objects">
      <div class="obj" id="obj-coral" style="--obj-color:#e0563c">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
      <div class="obj" id="obj-teal" style="--obj-color:#3aa39b">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
      <div class="obj" id="obj-amber" style="--obj-color:#e59a2e">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
      <div class="obj" id="obj-sky" style="--obj-color:#4f8fd6">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
      <div class="obj" id="obj-yellow" style="--obj-color:#e8c53a">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
      <div class="obj" id="obj-violet" style="--obj-color:#8a6fd0">
        <svg viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
          <rect x="16" y="48" width="88" height="56" rx="10" fill="var(--obj-color)"/>
          <rect x="10" y="28" width="100" height="26" rx="9" fill="var(--obj-color)"/>
          <rect x="18" y="50" width="84" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <rect x="12" y="30" width="96" height="22" rx="8" fill="none" stroke="#ffffff" stroke-width="5"/>
          <circle cx="60" cy="41" r="6" fill="#ffffff"/>
        </svg>
      </div>
    </div>

    <div class="prop prop-sign" id="prop-sign">
      <div class="prop-foot" data-hf-prop-foot>
        <svg viewBox="0 0 220 150" width="220" height="150" aria-hidden="true">
          <rect x="6" y="8" width="208" height="116" rx="12" fill="var(--prop-face)"/>
          <rect x="16" y="18" width="188" height="96" rx="8" fill="none" stroke="#ffffff" stroke-width="6"/>
          <rect x="34" y="42" width="152" height="14" rx="7" fill="var(--prop-ink)" opacity=".7"/>
          <rect x="34" y="70" width="112" height="14" rx="7" fill="var(--prop-ink)" opacity=".45"/>
          <rect x="88" y="124" width="44" height="12" rx="6" fill="var(--prop-ink)"/>
        </svg>
      </div>
    </div>

    <div class="explain-tag" id="explain-tag">共同点</div>
  </section>

  <!-- 第 3 层 · overlay：焦点光与指示，不独立承载信息 -->
  <section class="layer layer-overlay" data-hf-layer="overlay" aria-hidden="true">
    <svg class="leaders" id="leaders" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <path class="leader" id="leader-0" d="M0 0"/>
      <path class="leader" id="leader-1" d="M0 0"/>
      <path class="leader" id="leader-2" d="M0 0"/>
      <path class="leader" id="leader-3" d="M0 0"/>
      <path class="leader" id="leader-4" d="M0 0"/>
      <path class="leader" id="leader-5" d="M0 0"/>
    </svg>
    <div class="spot spot-a" id="spot-a"></div>
    <div class="spot spot-b" id="spot-b"></div>
    <div class="flybar"><span class="flybar-rail"></span><span class="lamp lamp-a"></span><span class="lamp lamp-b"></span></div>
  </section>

  <!-- 第 4 层 · text：独立文字与阅读正文 -->
  <section class="layer layer-text" data-hf-layer="text">
    <header class="header">
      <span class="step" id="step">① 观察</span>
      <span class="sub">小型纸舞台 · 16s 无声编排示例</span>
    </header>
    <p class="callout" id="callout">观察：六件物品各不相同</p>
    <div class="recap" id="recap">
      <span class="chip">① 观察</span><span class="arrow">→</span>
      <span class="chip">② 分组</span><span class="arrow">→</span>
      <span class="chip">③ 解释</span>
    </div>
  </section>

  <!-- 幕布只在开场与收尾开合 -->
  <div class="proscenium" aria-hidden="true">
    <div class="curtain-half curtain-left" id="curtain-left"></div>
    <div class="curtain-half curtain-right" id="curtain-right"></div>
    <div class="title-card" id="title-card">
      <strong>观察 → 分组 → 解释</strong>
      <span>把六件物品看懂的过程</span>
    </div>
    <div class="frame-border frame-top"></div>
    <div class="frame-border frame-bottom"></div>
  </div>
</main>
<script src="runtime/gsap.min.js"></script>
    <script src="runtime/MotionPathPlugin.min.js"></script>
<script src="runtime/scene-binding.js"></script>
<script src="runtime/stage-rig.js"></script>
<script src="scene.js"></script>
</body>
</html>
