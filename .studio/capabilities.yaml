version: 1

product_lines: lines.yaml
settings: settings.yaml
reference_mechanisms: mechanisms.yaml

workflows:
  hyperframes_video:
    skill: ../.agents/skills/hyperframes-codex-workflow/SKILL.md
    modes: [card, explainer]
    default_mode: card
    ip_recommended_mode: explainer
  podcast_quote_image:
    planner_skill: ../.agents/skills/podcast-quote-image/SKILL.md
    copy_skill: ../.agents/skills/xiaohongshu-article-copy/SKILL.md
    fallback: ../.agents/skills/native-subtitle-quote-image/SKILL.md
    downloader: trendradar-media
    downloader_contract: "2.0"
    youtube_transcript: youtube-transcript-api
    youtube_transcript_optional: true

templates:
  talking_head: recipes/talking-head.md
  pure_hyperframes: recipes/pure-hyperframes.md

copywriting:
  optional: [dbs-xhs-title, media-publish-check]
  podcast_quote_image:
    candidate_analysis: [dbs-spread, dbs-resonate]
    guest_research: RESEARCH.md
    package_pipeline:
      - invoke: dbs-content
        stage: after_body_and_section_heading_draft
        checks: [title_and_cover, expression_efficiency, cognitive_gap]
        output: revision_brief
      - invoke: dbs-xhs-title
        stage: after_revised_body_is_stable
        output: formula_traceable_candidates_and_top_3
      - invoke: dbs-ai-check
        stage: after_final_title_is_selected
        output: diagnostic_report
    excluded: [dbs-hook, dbs-script-flow]

packaging:
  required: [dbs-xhs-title]

excluded_v1:
  global: [prompt_library, public_publishing]
  podcast_quote_image: [bundled_asr, image_generation]
