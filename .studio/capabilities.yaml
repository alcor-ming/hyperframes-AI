version: 1

workflows:
  hyperframes_video:
    skill: ../.agents/skills/hyperframes-codex-workflow/SKILL.md
  podcast_quote_image:
    planner_skill: ../.agents/skills/podcast-quote-image/SKILL.md
    copy_skill: ../.agents/skills/xiaohongshu-article-copy/SKILL.md
    fallback: ../.agents/skills/native-subtitle-quote-image/SKILL.md
    downloader: trendradar-media
    downloader_contract: "2.0"
    youtube_transcript: youtube-transcript-api
    youtube_transcript_optional: true

templates:
  talking_head: recipes/talking-head.md
  pure_hyperframes: recipes/pure-hyperframes.md

profiles:
  optical_fluidity:
    profile: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/01-optical-fluidity/PROFILE.md
    tokens: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/01-optical-fluidity/tokens.json
  kami_editorial:
    profile: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/02-kami-editorial/PROFILE.md
    tokens: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/02-kami-editorial/tokens.json
  monochrome_atelier:
    profile: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/03-monochrome-atelier/PROFILE.md
    tokens: ../.agents/skills/hyperframes-codex-workflow/references/hyperframes-design-profile-pack-v0.1.0/profiles/03-monochrome-atelier/tokens.json

copywriting:
  default: [dbs-content, dbs-hook, dbs-script-flow, dbs-ai-check]
  optional: [dbs-xhs-title, media-publish-check]
  podcast_quote_image:
    candidate_analysis: [dbs-spread, dbs-resonate]
    package_title: dbs-xhs-title
    package_checks: [dbs-content.expression_efficiency, dbs-content.cognitive_gap]
    package_qa: dbs-ai-check
    excluded: [dbs-hook, dbs-script-flow]

packaging:
  required: [dbs-xhs-title]

excluded_v1:
  global: [prompt_library, publishing]
  hyperframes_video: [bottom_subtitles]
  podcast_quote_image: [bundled_asr, image_generation]
